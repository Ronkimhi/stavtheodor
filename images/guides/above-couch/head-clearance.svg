<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Side view of a person leaning back on a sofa: a frame 4 to 6 inches above the sofa back sits where the head rests, while a frame 8 to 10 inches above it clears the head</title>
<desc id="d">Side view of a person leaning back on a sofa: a frame 4 to 6 inches above the sofa back sits where the head rests, while a frame 8 to 10 inches above it clears the head</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 7 px; floor at y=780; two side sections, walls at x=520 and x=1220; sofa back 32 in; frames in profile 34 in tall, bottoms at 37 in (dotted, left) and 41 in (solid, right); head top 39 in -->
<!-- close: wall at x=520, floor segment 80 to 520 -->
<line class="ink" x1="80" y1="780" x2="520" y2="780"/>
<line class="ink" x1="520" y1="780" x2="520" y2="150"/>
<!-- sofa in section: seat 18 in, back cushion 8 in thick to 32 in -->
<rect class="soft" x="268" y="654" width="196" height="28"/>
<rect class="soft" x="268" y="682" width="252" height="70"/>
<rect class="soft" x="464" y="556" width="56" height="98"/>
<line class="soft" x1="282" y1="752" x2="282" y2="780"/>
<line class="soft" x1="506" y1="752" x2="506" y2="780"/>
<!-- figure leaning back: hip on the seat, the back of the head at the wall, head top 39 in [anthropometric, drawn, not labelled] -->
<circle class="soft" cx="480" cy="533" r="26"/>
<line class="soft" x1="443" y1="563" x2="480" y2="559"/>
<line class="soft" x1="338" y1="654" x2="443" y2="563"/>
<line class="soft" x1="338" y1="654" x2="240" y2="654"/>
<line class="soft" x1="240" y1="654" x2="240" y2="780"/>
<line class="soft" x1="443" y1="563" x2="366" y2="640"/>
<!-- dotted frame in profile, bottom 37 in (5 in gap): the head overlaps its lower 2 in -->
<rect class="lead" x="508" y="283" width="12" height="238"/>
<line class="dim" x1="544" y1="556" x2="544" y2="521"/>
<line class="dim" x1="536" y1="556" x2="552" y2="556"/>
<line class="dim" x1="536" y1="521" x2="552" y2="521"/>
<text class="l1" x="558" y="517">4 to 6 in<tspan class="l2"> · 10 to 15 cm</tspan></text>
<text class="l1" x="558" y="573">one studio's figure</text>
<text class="l2" x="440" y="529" text-anchor="end">heads rest here</text>
<!-- clear: wall at x=1220, floor segment 780 to 1220 -->
<line class="ink" x1="780" y1="780" x2="1220" y2="780"/>
<line class="ink" x1="1220" y1="780" x2="1220" y2="150"/>
<!-- sofa in section: seat 18 in, back cushion 8 in thick to 32 in -->
<rect class="soft" x="968" y="654" width="196" height="28"/>
<rect class="soft" x="968" y="682" width="252" height="70"/>
<rect class="soft" x="1164" y="556" width="56" height="98"/>
<line class="soft" x1="982" y1="752" x2="982" y2="780"/>
<line class="soft" x1="1206" y1="752" x2="1206" y2="780"/>
<!-- figure leaning back: hip on the seat, the back of the head at the wall, head top 39 in [anthropometric, drawn, not labelled] -->
<circle class="soft" cx="1180" cy="533" r="26"/>
<line class="soft" x1="1143" y1="563" x2="1180" y2="559"/>
<line class="soft" x1="1038" y1="654" x2="1143" y2="563"/>
<line class="soft" x1="1038" y1="654" x2="940" y2="654"/>
<line class="soft" x1="940" y1="654" x2="940" y2="780"/>
<line class="soft" x1="1143" y1="563" x2="1066" y2="640"/>
<!-- solid frame in profile, bottom 41 in (9 in gap), center 58: 2 in clear of the head -->
<rect class="frame" x="1208" y="255" width="12" height="238"/>
<rect class="art" x="1211" y="261" width="6" height="226"/>
<line class="dim" x1="1192" y1="374" x2="1236" y2="374" stroke-width="2"/>
<line class="dim" x1="1214" y1="352" x2="1214" y2="396" stroke-width="2"/>
<line class="dim" x1="1244" y1="556" x2="1244" y2="493"/>
<line class="dim" x1="1236" y1="556" x2="1252" y2="556"/>
<line class="dim" x1="1236" y1="493" x2="1252" y2="493"/>
<text class="l1" x="1258" y="534">8 to 10 in<tspan class="l2"> · 20 to 25 cm</tspan></text>
</svg>
