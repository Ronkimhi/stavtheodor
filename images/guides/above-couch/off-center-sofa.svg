<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Elevation of a sofa placed off center on a long wall: the art is centered on the sofa, and a dotted outline shows the wrong position centered on the wall</title>
<desc id="d">Elevation of a sofa placed off center on a long wall: the art is centered on the sofa, and a dotted outline shows the wrong position centered on the wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; floor at y=580; wall 192 in from x=416; sofa 84 in at 24 in from the left; door 36 in at the right end -->
<line class="ink" x1="80" y1="580" x2="1520" y2="580"/>
<line class="ink" x1="416" y1="580" x2="416" y2="196"/>
<line class="ink" x1="1184" y1="580" x2="1184" y2="196"/>
<path class="ink" d="M1040 580 L1040 260 L1184 260"/>
<rect class="soft" x="512" y="452" width="336" height="64"/>
<rect class="soft" x="512" y="516" width="336" height="24"/>
<rect class="soft" x="512" y="476" width="24" height="40"/>
<rect class="soft" x="824" y="476" width="24" height="40"/>
<line class="soft" x1="528" y1="540" x2="528" y2="580"/>
<line class="soft" x1="832" y1="540" x2="832" y2="580"/>
<!-- work 56 by 38 in centered on the sofa, bottom 41, center 60; ghost centered on the wall at 96 in -->
<rect class="lead" x="688" y="264" width="224" height="152"/>
<rect class="frame" x="568" y="264" width="224" height="152"/>
<rect class="art" x="584" y="280" width="192" height="120"/>
<line class="dim" x1="658" y1="340" x2="702" y2="340" stroke-width="2"/>
<line class="dim" x1="680" y1="318" x2="680" y2="362" stroke-width="2"/>
<text class="l1" x="680" y="630" text-anchor="middle">centered on the sofa<tspan class="l2"> · two thirds of 84 in</tspan></text>
<text class="l1" x="840" y="224" text-anchor="middle">not on the wall</text>
<line class="lead" x1="860" y1="234" x2="880" y2="260"/>
</svg>
