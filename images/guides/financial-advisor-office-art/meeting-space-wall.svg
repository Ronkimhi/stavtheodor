<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Two floor plans of the same meeting space: on the left the work hangs on the wall behind the advisor, where both clients' lines of sight land; on the right it hangs behind the clients, where only the advisor sees it</title>
<desc id="d">Two floor plans of the same meeting space: on the left the work hangs on the wall behind the advisor, where both clients' lines of sight land; on the right it hangs behind the clients, where only the advisor sees it</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; two plans of one meeting space 156 by 132 in, north at the top; panel A north west corner at (136, 112), panel B at (840, 112) -->
<!-- panel A: the work on the east wall, behind the advisor, where both client sightlines land -->
<!-- walls with the door gap x 102 to 138 in the south wall; window north wall x 42 to 114; door hinge x 102, leaf to y 96 -->
<path class="ink" d="M544 640 L136 640 L136 112 L760 112 L760 640 L688 640"/>
<rect class="soft" x="304" y="106" width="288" height="12"/>
<line class="soft" x1="544" y1="640" x2="544" y2="496"/>
<path class="soft" d="M544 496 A144 144 0 0 1 688 640"/>
<!-- table 36 by 60 at x 54 to 90, y 36 to 96; client chairs x 30 to 54 facing east; advisor's chair x 90 to 114, y 54 to 78 facing west; credenza 18 by 72 at x 138 to 156, y 30 to 102 -->
<rect class="soft" x="352" y="256" width="144" height="240"/>
<rect class="soft" x="256" y="280" width="96" height="96" rx="6"/>
<rect class="soft" x="256" y="280" width="12" height="96" rx="4"/>
<rect class="soft" x="256" y="376" width="96" height="96" rx="6"/>
<rect class="soft" x="256" y="376" width="12" height="96" rx="4"/>
<rect class="soft" x="496" y="328" width="96" height="96" rx="6"/>
<rect class="soft" x="580" y="328" width="12" height="96" rx="4"/>
<rect class="soft" x="688" y="232" width="72" height="288"/>
<text class="l2" x="448" y="142" text-anchor="middle">window</text>
<text class="l2" x="520" y="592" text-anchor="end">door</text>
<text class="l2" x="748" y="208" text-anchor="end">credenza</text>
<text class="l2" x="304" y="520" text-anchor="middle">client</text>
<text class="l2" x="544" y="296" text-anchor="middle">you</text>
<line class="eye" x1="304" y1="328" x2="760" y2="376"/>
<circle class="tp" cx="304" cy="328" r="6"/>
<line class="eye" x1="304" y1="424" x2="760" y2="376"/>
<circle class="tp" cx="304" cy="424" r="6"/>
<rect class="tp" x="754" y="280" width="12" height="192"/>
<text class="l1" x="448" y="696" text-anchor="middle">Where the client looks</text>
<text class="l2" x="448" y="728" text-anchor="middle">calm enough to frame you</text>
<!-- panel B: the work on the west wall, behind the clients; their sightlines land on the bare east wall -->
<!-- walls with the door gap x 102 to 138 in the south wall; window north wall x 42 to 114; door hinge x 102, leaf to y 96 -->
<path class="ink" d="M1248 640 L840 640 L840 112 L1464 112 L1464 640 L1392 640"/>
<rect class="soft" x="1008" y="106" width="288" height="12"/>
<line class="soft" x1="1248" y1="640" x2="1248" y2="496"/>
<path class="soft" d="M1248 496 A144 144 0 0 1 1392 640"/>
<!-- table 36 by 60 at x 54 to 90, y 36 to 96; client chairs x 30 to 54 facing east; advisor's chair x 90 to 114, y 54 to 78 facing west; credenza 18 by 72 at x 138 to 156, y 30 to 102 -->
<rect class="soft" x="1056" y="256" width="144" height="240"/>
<rect class="soft" x="960" y="280" width="96" height="96" rx="6"/>
<rect class="soft" x="960" y="280" width="12" height="96" rx="4"/>
<rect class="soft" x="960" y="376" width="96" height="96" rx="6"/>
<rect class="soft" x="960" y="376" width="12" height="96" rx="4"/>
<rect class="soft" x="1200" y="328" width="96" height="96" rx="6"/>
<rect class="soft" x="1284" y="328" width="12" height="96" rx="4"/>
<rect class="soft" x="1392" y="232" width="72" height="288"/>
<text class="l2" x="1008" y="520" text-anchor="middle">client</text>
<text class="l2" x="1248" y="296" text-anchor="middle">you</text>
<line class="eye" x1="1008" y1="328" x2="1464" y2="376"/>
<circle class="tp" cx="1008" cy="328" r="6"/>
<line class="eye" x1="1008" y1="424" x2="1464" y2="376"/>
<circle class="tp" cx="1008" cy="424" r="6"/>
<line class="eye" x1="1248" y1="376" x2="840" y2="376"/>
<circle class="tp" cx="1248" cy="376" r="6"/>
<rect class="tp" x="834" y="280" width="12" height="192"/>
<text class="l1" x="1152" y="696" text-anchor="middle">Behind the client</text>
<text class="l2" x="1152" y="728" text-anchor="middle">only you see it</text>
</svg>
