<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<!-- scale: 6 px per in, side section, floor at y 880; ceiling plan inset 2.5 px per in -->
<title id="t">Side section of an office wall under a 9 foot ceiling on a 24 inch, 61 centimeter, grid: the target setback is 29.5 inches, 75 centimeters; a spot on the first grid line, 24 inches from the wall, aims at the work at about 25 degrees, and one on the next line, 48 inches out, at about 43 degrees, too shallow; a ceiling plan inset shows a track on the first grid line along the art wall</title>
<desc id="d">Side section of an office wall under a 9 foot ceiling on a 24 inch, 61 centimeter, grid: the target setback is 29.5 inches, 75 centimeters; a spot on the first grid line, 24 inches from the wall, aims at the work at about 25 degrees, and one on the next line, 48 inches out, at about 43 degrees, too shallow; a ceiling plan inset shows a track on the first grid line along the art wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:46px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- side section, 9 ft ceiling on a 24 in grid from the wall; grid lines at 24, 48, 72 in -->
<line class="ink" x1="100" y1="880" x2="1000" y2="880"/>
<line class="ink" x1="100" y1="232" x2="1000" y2="232"/>
<line class="ink" x1="1000" y1="232" x2="1000" y2="880"/>
<line class="soft" x1="856" y1="218" x2="856" y2="246"/>
<line class="soft" x1="712" y1="218" x2="712" y2="246"/>
<line class="soft" x1="568" y1="218" x2="568" y2="246"/>
<line class="soft" x1="424" y1="218" x2="424" y2="246"/>
<line class="soft" x1="280" y1="218" x2="280" y2="246"/>
<line class="soft" x1="136" y1="218" x2="136" y2="246"/>
<rect class="frame" x="991" y="430" width="9" height="216"/>
<rect class="art" x="993" y="432" width="5" height="212"/>
<path class="soft" d="M848 232 L864 232 L861 239 L851 239 Z"/>
<line class="dim" x1="856" y1="239" x2="991" y2="538"/>
<!-- grid line 24 in: 24.3 degrees from vertical -->
<path class="soft" d="M704 232 L720 232 L717 239 L707 239 Z"/>
<line class="lead" x1="712" y1="239" x2="991" y2="538"/>
<!-- grid line 48 in: 43.0 degrees from vertical -->
<line class="eye" x1="856" y1="239" x2="856" y2="392"/>
<line class="dim" x1="823.3" y1="182" x2="1000" y2="182"/>
<line class="dim" x1="823.3" y1="174" x2="823.3" y2="190"/>
<line class="dim" x1="1000" y1="174" x2="1000" y2="190"/>
<line class="dim" x1="712" y1="276" x2="856" y2="276"/>
<line class="dim" x1="712" y1="268" x2="712" y2="284"/>
<line class="dim" x1="856" y1="268" x2="856" y2="284"/>
<text class="l1" x="784" y="320" text-anchor="middle">24 in grid<tspan class="l2"> (61 cm)</tspan></text>
<text class="l1" x="910" y="162" text-anchor="middle">setback 29.5 in<tspan class="l2"> (75 cm)</tspan></text>
<text class="l1" x="1024" y="352">first line: about 25°</text>
<text class="l1" x="640" y="578" text-anchor="middle">next line: about 43°, too shallow</text>
<!-- reflected ceiling plan inset x 1100 to 1540: the art wall at the right, track on the first grid line -->
<line class="soft" x1="1100" y1="520" x2="1100" y2="820"/>
<line class="soft" x1="1160" y1="520" x2="1160" y2="820"/>
<line class="soft" x1="1220" y1="520" x2="1220" y2="820"/>
<line class="soft" x1="1280" y1="520" x2="1280" y2="820"/>
<line class="soft" x1="1340" y1="520" x2="1340" y2="820"/>
<line class="soft" x1="1400" y1="520" x2="1400" y2="820"/>
<line class="soft" x1="1460" y1="520" x2="1460" y2="820"/>
<line class="soft" x1="1100" y1="520" x2="1460" y2="520"/>
<line class="soft" x1="1100" y1="580" x2="1460" y2="580"/>
<line class="soft" x1="1100" y1="640" x2="1460" y2="640"/>
<line class="soft" x1="1100" y1="700" x2="1460" y2="700"/>
<line class="soft" x1="1100" y1="760" x2="1460" y2="760"/>
<line class="soft" x1="1100" y1="820" x2="1460" y2="820"/>
<line class="ink" x1="1460" y1="500" x2="1460" y2="840"/>
<line class="dim" x1="1400" y1="530" x2="1400" y2="810"/>
<circle class="tp" cx="1400" cy="556" r="6"/>
<circle class="tp" cx="1400" cy="632" r="6"/>
<circle class="tp" cx="1400" cy="708" r="6"/>
<circle class="tp" cx="1400" cy="784" r="6"/>
<text class="l1" x="1280" y="480" text-anchor="middle">track on the first line</text>
<text class="l2" x="1280" y="876" text-anchor="middle">ceiling plan, art wall at right</text>
</svg>
