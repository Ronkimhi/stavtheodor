<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<!-- scale: 5 px per in, two side sections, floor at y 780 -->
<title id="t">Two side sections of a glazed work under a 9 foot ceiling: with the spot 29.5 inches, 75 centimeters, from the wall at about 30 degrees, the reflection falls to the floor; with the spot 90 inches, 229 centimeters, out, the reflection from the top of the glass reaches the eyes of a standing viewer</title>
<desc id="d">Two side sections of a glazed work under a 9 foot ceiling: with the spot 29.5 inches, 75 centimeters, from the wall at about 30 degrees, the reflection falls to the floor; with the spot 90 inches, 229 centimeters, out, the reflection from the top of the glass reaches the eyes of a standing viewer</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:46px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- two side sections, 9 ft ceiling; glazed work 40 in tall, 37 to 77 in, center 57 in -->
<line class="ink" x1="120" y1="780" x2="700" y2="780"/>
<line class="ink" x1="120" y1="240" x2="700" y2="240"/>
<line class="ink" x1="700" y1="240" x2="700" y2="780"/>
<rect class="frame" x="692" y="395" width="8" height="200"/>
<rect class="art" x="694" y="397" width="4" height="196"/>
<path class="soft" d="M544.8 240 L560.8 240 L557.8 247 L547.8 247 Z"/>
<line class="dim" x1="552.8" y1="247" x2="692" y2="495"/>
<line class="dim" x1="692" y1="495" x2="532" y2="780"/>
<circle class="soft" cx="280" cy="487.5" r="22"/>
<line class="soft" x1="280" y1="509.5" x2="280" y2="674.7"/>
<line class="soft" x1="280" y1="674.7" x2="255.8" y2="780"/>
<line class="soft" x1="280" y1="674.7" x2="304.2" y2="780"/>
<line class="soft" x1="280" y1="521.6" x2="247" y2="679.1"/>
<line class="soft" x1="280" y1="521.6" x2="313" y2="679.1"/>
<line class="dim" x1="552.8" y1="270" x2="700" y2="270"/>
<line class="dim" x1="552.8" y1="262" x2="552.8" y2="278"/>
<line class="dim" x1="700" y1="262" x2="700" y2="278"/>
<text class="l1" x="410" y="830" text-anchor="middle">about 30°: reflection to the floor</text>
<text class="l1" x="540.8" y="218" text-anchor="end">29.5 in<tspan class="l2"> (75 cm)</tspan></text>
<line class="ink" x1="900" y1="780" x2="1500" y2="780"/>
<line class="ink" x1="900" y1="240" x2="1500" y2="240"/>
<line class="ink" x1="1500" y1="240" x2="1500" y2="780"/>
<rect class="frame" x="1492" y="395" width="8" height="200"/>
<rect class="art" x="1494" y="397" width="4" height="196"/>
<!-- far spot: 71.5 degrees from vertical to the top of the glass; the reflection meets the eye at x 1216 (57 in from the wall) -->
<path class="soft" d="M1042 240 L1058 240 L1055 247 L1045 247 Z"/>
<line class="dim" x1="1050" y1="247" x2="1492" y2="395"/>
<line class="dim" x1="1492" y1="395" x2="1215.8" y2="487.5"/>
<circle class="soft" cx="1193.8" cy="487.5" r="22"/>
<line class="soft" x1="1193.8" y1="509.5" x2="1193.8" y2="674.7"/>
<line class="soft" x1="1193.8" y1="674.7" x2="1169.5" y2="780"/>
<line class="soft" x1="1193.8" y1="674.7" x2="1218" y2="780"/>
<line class="soft" x1="1193.8" y1="521.6" x2="1160.8" y2="679.1"/>
<line class="soft" x1="1193.8" y1="521.6" x2="1226.8" y2="679.1"/>
<line class="dim" x1="1050" y1="270" x2="1500" y2="270"/>
