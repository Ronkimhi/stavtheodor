<line class="dim" x1="1500" y1="262" x2="1500" y2="278"/>
<text class="l1" x="1275" y="218" text-anchor="middle">90 in<tspan class="l2"> (229 cm)</tspan></text>
<text class="l1" x="1200" y="830" text-anchor="middle">too far out: reflection in the eyes</text>
<text class="l2" x="1478" y="635" text-anchor="end">glazing</text>
</svg>
