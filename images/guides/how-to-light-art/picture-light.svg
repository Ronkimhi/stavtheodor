<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<!-- scale: 8 px per in, elevation and two side sections, floor at y 780; tall work shortened at the top -->
<title id="t">Elevation of a frame 30 inches, 76 centimeters, wide with a picture light above it 15 to 20 inches, 38 to 51 centimeters, wide, half to two thirds of the frame; a side section shows the lamp held clear of the frame with the light running down the face; a second section shows a tall work whose lower part falls dim under a picture light</title>
<desc id="d">Elevation of a frame 30 inches, 76 centimeters, wide with a picture light above it 15 to 20 inches, 38 to 51 centimeters, wide, half to two thirds of the frame; a side section shows the lamp held clear of the frame with the light running down the face; a second section shows a tall work whose lower part falls dim under a picture light</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:46px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- elevation: frame 30 by 24 in, center 57 in; picture light 15 to 20 in wide, centered -->
<line class="ink" x1="80" y1="780" x2="820" y2="780"/>
<line class="eye" x1="80" y1="324" x2="820" y2="324"/>
<rect class="frame" x="300.0" y="228" width="240" height="192"/>
<rect class="art" x="314.0" y="242" width="212" height="164"/>
<rect class="soft" x="340.0" y="206" width="160" height="8"/>
<rect class="lead" x="360.0" y="206" width="120" height="8"/>
<line class="dim" x1="300" y1="454" x2="540" y2="454"/>
<line class="dim" x1="300" y1="446" x2="300" y2="462"/>
<line class="dim" x1="540" y1="446" x2="540" y2="462"/>
<line class="dim" x1="340" y1="172" x2="500" y2="172"/>
<line class="dim" x1="340" y1="164" x2="340" y2="180"/>
<line class="dim" x1="500" y1="164" x2="500" y2="180"/>
<line class="dim" x1="360" y1="164" x2="360" y2="180"/>
<line class="dim" x1="480" y1="164" x2="480" y2="180"/>
<text class="l1" x="420" y="500" text-anchor="middle">frame 30 in<tspan class="l2"> (76 cm)</tspan></text>
<text class="l1" x="420" y="148" text-anchor="middle">light 15 to 20 in<tspan class="l2"> (38 to 51 cm)</tspan></text>
<text class="l2" x="420" y="110" text-anchor="middle">half to two thirds of the frame width</text>
<!-- side section of the same work: arm and lamp clear of the frame, beam down the face -->
<line class="ink" x1="900" y1="780" x2="1150" y2="780"/>
<line class="ink" x1="1150" y1="120" x2="1150" y2="780"/>
<rect class="frame" x="1140" y="228" width="10" height="192"/>
<rect class="art" x="1142" y="230" width="6" height="188"/>
<line class="soft" x1="1150" y1="202" x2="1094" y2="192"/>
<rect class="soft" x="1080" y="186" width="22" height="12"/>
<line class="dim" x1="1091" y1="198" x2="1140" y2="238"/>
<line class="dim" x1="1091" y1="198" x2="1140" y2="410"/>
<text class="l1" x="1060" y="162" text-anchor="end">lamp clear of the frame</text>
<!-- tall work, 60 in high, 24 to 84 in: the picture light reaches its upper part; the lower part falls dim -->
<line class="ink" x1="1250" y1="780" x2="1480" y2="780"/>
<line class="ink" x1="1480" y1="120" x2="1480" y2="780"/>
<rect class="frame" x="1470" y="228" width="10" height="360"/>
<rect class="art" x="1472" y="230" width="6" height="162.0"/>
<line class="soft" x1="1480" y1="202" x2="1424" y2="192"/>
<rect class="soft" x="1410" y="186" width="22" height="12"/>
<line class="dim" x1="1421" y1="198" x2="1470" y2="390"/>
<line class="lead" x1="1450" y1="426" x2="1450" y2="588"/>
<text class="l1" x="1365" y="836" text-anchor="middle">tall work: lower part dim</text>
</svg>
