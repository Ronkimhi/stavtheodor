<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Plan and elevation of a narrow hallway: a short viewing distance across the hall, a row of small works hung on one centerline at 57 to 60 inches with equal gaps, and slim frames that stay close to the wall</title>
<desc id="d">Plan and elevation of a narrow hallway: a short viewing distance across the hall, a row of small works hung on one centerline at 57 to 60 inches with equal gaps, and slim frames that stay close to the wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px for the plan and the elevation; floor of the elevation at y=780 -->
<!-- plan: hall 40 in wide, 120 in long; works as bars on the north wall only -->
<line class="ink" x1="500" y1="100" x2="1100" y2="100"/>
<polyline class="ink" points="1100,300 610,300"/>
<line class="ink" x1="500" y1="300" x2="520" y2="300"/>
<line class="soft" x1="520" y1="300" x2="520" y2="390"/>
<path class="soft" d="M520 390 A90 90 0 0 0 610 300"/>
<rect class="tp" x="565" y="94" width="70" height="12"/>
<rect class="tp" x="665" y="94" width="70" height="12"/>
<rect class="tp" x="765" y="94" width="70" height="12"/>
<rect class="tp" x="865" y="94" width="70" height="12"/>
<rect class="tp" x="965" y="94" width="70" height="12"/>
<circle class="tp" cx="800" cy="280" r="6"/>
<line class="dim" x1="800" y1="103" x2="800" y2="272"/><line class="dim" x1="792" y1="103" x2="808" y2="103"/><line class="dim" x1="792" y1="272" x2="808" y2="272"/>
<text class="l2" x="814" y="208">short viewing distance</text>
<line class="dim" x1="470" y1="100" x2="470" y2="300"/><line class="dim" x1="462" y1="100" x2="478" y2="100"/><line class="dim" x1="462" y1="300" x2="478" y2="300"/>
<text class="l2" x="456" y="208" text-anchor="end">40 in hall</text>
<text class="l1" x="1130" y="109">one side only</text>
<!-- elevation of that wall: five 14 by 18 in frames on one centerline at 58 in, gaps 6 in -->
<line class="ink" x1="80" y1="780" x2="1520" y2="780"/>
<line class="eye" x1="500" y1="495" x2="1380" y2="495"/><line class="eye" x1="500" y1="480" x2="1380" y2="480"/>
<rect class="frame" x="565" y="445" width="70" height="90"/><rect class="art" x="573" y="453" width="54" height="74"/>
<line class="dim" x1="578" y1="490" x2="622" y2="490" stroke-width="2"/><line class="dim" x1="600" y1="468" x2="600" y2="512" stroke-width="2"/>
<rect class="frame" x="665" y="445" width="70" height="90"/><rect class="art" x="673" y="453" width="54" height="74"/>
<line class="dim" x1="678" y1="490" x2="722" y2="490" stroke-width="2"/><line class="dim" x1="700" y1="468" x2="700" y2="512" stroke-width="2"/>
<rect class="frame" x="765" y="445" width="70" height="90"/><rect class="art" x="773" y="453" width="54" height="74"/>
<line class="dim" x1="778" y1="490" x2="822" y2="490" stroke-width="2"/><line class="dim" x1="800" y1="468" x2="800" y2="512" stroke-width="2"/>
<rect class="frame" x="865" y="445" width="70" height="90"/><rect class="art" x="873" y="453" width="54" height="74"/>
<line class="dim" x1="878" y1="490" x2="922" y2="490" stroke-width="2"/><line class="dim" x1="900" y1="468" x2="900" y2="512" stroke-width="2"/>
<rect class="frame" x="965" y="445" width="70" height="90"/><rect class="art" x="973" y="453" width="54" height="74"/>
<line class="dim" x1="978" y1="490" x2="1022" y2="490" stroke-width="2"/><line class="dim" x1="1000" y1="468" x2="1000" y2="512" stroke-width="2"/>
<line class="dim" x1="635" y1="421" x2="665" y2="421"/><line class="dim" x1="635" y1="413" x2="635" y2="429"/><line class="dim" x1="665" y1="413" x2="665" y2="429"/>
<line class="dim" x1="735" y1="421" x2="765" y2="421"/><line class="dim" x1="735" y1="413" x2="735" y2="429"/><line class="dim" x1="765" y1="413" x2="765" y2="429"/>
<line class="dim" x1="835" y1="421" x2="865" y2="421"/><line class="dim" x1="835" y1="413" x2="835" y2="429"/><line class="dim" x1="865" y1="413" x2="865" y2="429"/>
<line class="dim" x1="935" y1="421" x2="965" y2="421"/><line class="dim" x1="935" y1="413" x2="935" y2="429"/><line class="dim" x1="965" y1="413" x2="965" y2="429"/>
<text class="l1" x="800" y="405" text-anchor="middle">equal gaps</text>
<text class="l1" x="1380" y="468" text-anchor="end">57 to 60 in<tspan class="l2"> · 145 to 152 cm</tspan></text>
<text class="l2" x="800" y="579" text-anchor="middle">slim, flat frames</text>
</svg>
