<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">A long wall drawn twice: divided into a sofa zone and a dining zone, each with its own centered art, and wrongly covered by one row of small frames spread along its whole length</title>
<desc id="d">A long wall drawn twice: divided into a sofa zone and a dining zone, each with its own centered art, and wrongly covered by one row of small frames spread along its whole length</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 2.8 px; two elevations of a 288 in wall from x=397, floors at y=380 and y=680; sofa 84 in at 24 to 108 in, table 72 in at 180 to 252 in -->
<line class="ink" x1="397" y1="380" x2="1203.4" y2="380"/>
<line class="soft" x1="397" y1="380" x2="397" y2="111.2"/>
<line class="soft" x1="1203.4" y1="380" x2="1203.4" y2="111.2"/>
<line class="eye" x1="397" y1="220.4" x2="1203.4" y2="220.4"/>
<line class="eye" x1="397" y1="212" x2="1203.4" y2="212"/>
<rect class="soft" x="464.2" y="290.4" width="235.2" height="44.8"/>
<rect class="soft" x="464.2" y="335.2" width="235.2" height="16.8"/>
<rect class="soft" x="464.2" y="307.2" width="16.8" height="28"/>
<rect class="soft" x="682.6" y="307.2" width="16.8" height="28"/>
<line class="soft" x1="475.4" y1="352" x2="475.4" y2="380"/>
<line class="soft" x1="688.2" y1="352" x2="688.2" y2="380"/>
<rect class="soft" x="901" y="296" width="201.6" height="5.6"/>
<rect class="soft" x="909.4" y="301.6" width="5.6" height="78.4"/>
<rect class="soft" x="1088.6" y="301.6" width="5.6" height="78.4"/>
<!-- zone 1: work 56 by 38 centered on the sofa, bottom 41, center 60; zone 2: pair 20 by 28, 3.5 in apart, centered on the table, center 57 -->
<rect class="frame" x="503.4" y="158.8" width="156.8" height="106.4"/>
<rect class="art" x="511.4" y="166.8" width="140.8" height="90.4"/>
<line class="dim" x1="559.8" y1="212" x2="603.8" y2="212" stroke-width="2"/>
<line class="dim" x1="581.8" y1="190" x2="581.8" y2="234" stroke-width="2"/>
<rect class="frame" x="940.9" y="181.2" width="56" height="78.4"/>
<rect class="art" x="946.9" y="187.2" width="44" height="66.4"/>
<rect class="frame" x="1006.7" y="181.2" width="56" height="78.4"/>
<rect class="art" x="1012.7" y="187.2" width="44" height="66.4"/>
<line class="dim" x1="979.8" y1="220.4" x2="1023.8" y2="220.4" stroke-width="2"/>
<line class="dim" x1="1001.8" y1="198.4" x2="1001.8" y2="242.4" stroke-width="2"/>
<text class="l1" x="581.8" y="142.8" text-anchor="middle">zone 1</text>
<text class="l1" x="1001.8" y="165.2" text-anchor="middle">zone 2</text>
<text class="l2" x="800.2" y="324" text-anchor="middle">open wall</text>
<text class="l2" x="385" y="200" text-anchor="end">57 to 60 in</text>
<text class="l2" x="385" y="250.4" text-anchor="end">145 to 152 cm</text>
<line class="ink" x1="397" y1="680" x2="1203.4" y2="680"/>
<line class="soft" x1="397" y1="680" x2="397" y2="411.2"/>
<line class="soft" x1="1203.4" y1="680" x2="1203.4" y2="411.2"/>
<line class="eye" x1="397" y1="520.4" x2="1203.4" y2="520.4"/>
<line class="eye" x1="397" y1="512" x2="1203.4" y2="512"/>
<rect class="soft" x="464.2" y="590.4" width="235.2" height="44.8"/>
<rect class="soft" x="464.2" y="635.2" width="235.2" height="16.8"/>
<rect class="soft" x="464.2" y="607.2" width="16.8" height="28"/>
<rect class="soft" x="682.6" y="607.2" width="16.8" height="28"/>
<line class="soft" x1="475.4" y1="652" x2="475.4" y2="680"/>
<line class="soft" x1="688.2" y1="652" x2="688.2" y2="680"/>
<rect class="soft" x="901" y="596" width="201.6" height="5.6"/>
<rect class="soft" x="909.4" y="601.6" width="5.6" height="78.4"/>
<rect class="soft" x="1088.6" y="601.6" width="5.6" height="78.4"/>
<!-- wrong way: five 12 by 16 in frames at equal 38 in gaps across the whole wall, center 58 -->
<rect class="lead" x="503.4" y="495.2" width="33.6" height="44.8"/>
<rect class="lead" x="643.4" y="495.2" width="33.6" height="44.8"/>
<rect class="lead" x="783.4" y="495.2" width="33.6" height="44.8"/>
<rect class="lead" x="923.4" y="495.2" width="33.6" height="44.8"/>
<rect class="lead" x="1063.4" y="495.2" width="33.6" height="44.8"/>
<line class="dim" x1="778.2" y1="517.6" x2="822.2" y2="517.6" stroke-width="2"/>
<line class="dim" x1="800.2" y1="495.6" x2="800.2" y2="539.6" stroke-width="2"/>
<text class="l1" x="800" y="730" text-anchor="middle">one small group stretched</text>
</svg>
