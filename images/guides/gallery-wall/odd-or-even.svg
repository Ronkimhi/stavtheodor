<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Two gallery wall groups, one of four frames and one of five, each filling the same dotted outer rectangle around one anchor with equal gaps</title>
<desc id="d">Two gallery wall groups, one of four frames and one of five, each filling the same dotted outer rectangle around one anchor with equal gaps</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; floor at y=580; outer rectangle 48 by 32 in on each panel, center 58 in, gaps 2.5 in -->
<line class="ink" x1="80" y1="580" x2="1520" y2="580"/>
<line class="eye" x1="80" y1="295" x2="1520" y2="295"/>
<line class="eye" x1="80" y1="280" x2="1520" y2="280"/>
<text class="l2" x="80" y="268">57 to 60 in</text>
<text class="l2" x="80" y="325">145 to 152 cm</text>
<!-- 4 frames: anchor 24 by 32 in at the left; every outer edge touches the 48 by 32 in rectangle -->
<rect class="lead" x="320" y="210" width="240" height="160"/>
<rect class="frame" x="320" y="210" width="120" height="160"/>
<rect class="art" x="328" y="218" width="104" height="144"/>
<rect class="frame" x="452.5" y="210" width="107.5" height="45"/>
<rect class="art" x="458.5" y="216" width="95.5" height="33"/>
<rect class="frame" x="452.5" y="267.5" width="107.5" height="45"/>
<rect class="art" x="458.5" y="273.5" width="95.5" height="33"/>
<rect class="frame" x="452.5" y="325" width="107.5" height="45"/>
<rect class="art" x="458.5" y="331" width="95.5" height="33"/>
<line class="dim" x1="418" y1="290" x2="462" y2="290" stroke-width="2"/>
<line class="dim" x1="440" y1="268" x2="440" y2="312" stroke-width="2"/>
<text class="l2" x="380" y="196" text-anchor="middle">anchor</text>
<text class="l1" x="440" y="630" text-anchor="middle">4 frames</text>
<!-- 5 frames: anchor 24 by 32 in at the left; every outer edge touches the 48 by 32 in rectangle -->
<rect class="lead" x="1040" y="210" width="240" height="160"/>
<rect class="frame" x="1040" y="210" width="120" height="160"/>
<rect class="art" x="1048" y="218" width="104" height="144"/>
<rect class="frame" x="1172.5" y="210" width="47.5" height="73.8"/>
<rect class="art" x="1178.5" y="216" width="35.5" height="61.8"/>
<rect class="frame" x="1232.5" y="210" width="47.5" height="73.8"/>
<rect class="art" x="1238.5" y="216" width="35.5" height="61.8"/>
<rect class="frame" x="1172.5" y="296.2" width="47.5" height="73.8"/>
<rect class="art" x="1178.5" y="302.2" width="35.5" height="61.8"/>
<rect class="frame" x="1232.5" y="296.2" width="47.5" height="73.8"/>
<rect class="art" x="1238.5" y="302.2" width="35.5" height="61.8"/>
<line class="dim" x1="1138" y1="290" x2="1182" y2="290" stroke-width="2"/>
<line class="dim" x1="1160" y1="268" x2="1160" y2="312" stroke-width="2"/>
<text class="l2" x="1100" y="196" text-anchor="middle">anchor</text>
<text class="l1" x="1160" y="630" text-anchor="middle">5 frames</text>
<text class="l1" x="800" y="160" text-anchor="middle">one outer shape</text>
<line class="lead" x1="700" y1="168" x2="562" y2="206"/>
<line class="lead" x1="900" y1="168" x2="1038" y2="206"/>
<line class="dim" x1="574" y1="255" x2="574" y2="267.5"/>
<line class="dim" x1="566" y1="255" x2="582" y2="255"/>
<line class="dim" x1="566" y1="267.5" x2="582" y2="267.5"/>
<text class="l2" x="588" y="269.5">2.5 in · 6 cm, all equal</text>
</svg>
