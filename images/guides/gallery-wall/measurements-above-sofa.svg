<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Elevation drawing of a gallery wall above an 84 inch sofa: the group is 56 inches wide, its lowest frame sits 9 inches above the sofa back, frames are 2.5 inches apart, and the center of the group is marked at 58 inches from the floor</title>
