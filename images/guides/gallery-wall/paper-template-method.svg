<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Three step drawing of the paper template method: frames traced on kraft paper, each template marked with the hanging point, and the templates taped to the wall with a level line</title>
<desc id="d">Three step drawing of the paper template method: frames traced on kraft paper, each template marked with the hanging point, and the templates taped to the wall with a level line</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 6 px; the same 16 by 20 in frame in all three panels; wall elevation floor at y=580 -->
<!-- (1) a 16 by 20 in frame lying on a kraft sheet, outline traced, a pencil at the lower right corner -->
<rect class="soft" x="210" y="222" width="180" height="216"/>
<rect class="frame" x="252" y="270" width="96" height="120"/>
<rect class="art" x="268" y="286" width="64" height="88"/>
<rect class="soft" x="252" y="270" width="96" height="120"/>
<line class="ink" x1="352" y1="362" x2="388" y2="300" stroke-width="6"/>
<line class="ink" x1="348" y1="368" x2="352" y2="362"/>
<!-- (2) the cut template, hanging point 3 in below the top edge -->
<rect class="ink" x="732" y="270" width="96" height="120"/>
<line class="dim" x1="758" y1="288" x2="802" y2="288" stroke-width="2"/>
<line class="dim" x1="780" y1="266" x2="780" y2="310" stroke-width="2"/>
<line class="lead" x1="804" y1="288" x2="838" y2="288"/>
<line class="dim" x1="844" y1="270" x2="844" y2="288"/>
<line class="dim" x1="836" y1="270" x2="852" y2="270"/>
<line class="dim" x1="836" y1="288" x2="852" y2="288"/>
<text class="l2" x="780" y="434" text-anchor="middle">drop: top of frame to taut wire or D-ring</text>
<!-- (3) wall elevation: three templates taped up, tops on one level line, a 2.5 in spacer block between two -->
<line class="ink" x1="1040" y1="580" x2="1520" y2="580"/>
<rect class="ink" x="1141" y="172" width="96" height="120"/>
<line class="dim" x1="1167" y1="190" x2="1211" y2="190" stroke-width="2"/>
<line class="dim" x1="1189" y1="168" x2="1189" y2="212" stroke-width="2"/>
<rect class="soft" x="1135" y="168" width="24" height="8" transform="rotate(-45 1147 172)"/>
<rect class="soft" x="1219" y="168" width="24" height="8" transform="rotate(-45 1231 172)"/>
<rect class="ink" x="1252" y="172" width="96" height="120"/>
<line class="dim" x1="1278" y1="190" x2="1322" y2="190" stroke-width="2"/>
<line class="dim" x1="1300" y1="168" x2="1300" y2="212" stroke-width="2"/>
<rect class="soft" x="1246" y="168" width="24" height="8" transform="rotate(-45 1258 172)"/>
<rect class="soft" x="1330" y="168" width="24" height="8" transform="rotate(-45 1342 172)"/>
<rect class="ink" x="1363" y="172" width="96" height="120"/>
<line class="dim" x1="1389" y1="190" x2="1433" y2="190" stroke-width="2"/>
<line class="dim" x1="1411" y1="168" x2="1411" y2="212" stroke-width="2"/>
<rect class="soft" x="1357" y="168" width="24" height="8" transform="rotate(-45 1369 172)"/>
<rect class="soft" x="1441" y="168" width="24" height="8" transform="rotate(-45 1453 172)"/>
<line class="dim" x1="1111" y1="172" x2="1489" y2="172"/>
<line class="dim" x1="1111" y1="164" x2="1111" y2="180"/>
<line class="dim" x1="1489" y1="164" x2="1489" y2="180"/>
<rect class="ink" x="1348" y="262" width="15" height="24"/>
<line class="lead" x1="1355" y1="288" x2="1355" y2="322"/>
<text class="l2" x="1355" y="348" text-anchor="middle">spacer block, cut to your gap</text>
<text class="l1" x="300" y="640" text-anchor="middle">Trace</text>
<text class="l1" x="780" y="640" text-anchor="middle">Mark the hanging point</text>
<text class="l1" x="1300" y="640" text-anchor="middle">Tape up and level</text>
</svg>
