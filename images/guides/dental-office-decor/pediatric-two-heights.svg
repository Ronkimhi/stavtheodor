<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Elevation of a pediatric waiting area wall: a washable mural across the lower wall at a child's eye level, and framed works hung above a child's reach, higher than the 57 to 60 inch standing band</title>
<desc id="d">Elevation of a pediatric waiting area wall: a washable mural across the lower wall at a child's eye level, and framed works hung above a child's reach, higher than the 57 to 60 inch standing band</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:48px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; elevation of a 240 in wall, x 200 to 1400; floor at y=680, ceiling 108 in at y=140 -->
<!-- compact .l1 48 px, not 52: "57 to 60 in" at 52 would end 3 px from the left frame (Curator check 2026-09-30) -->
<!-- floor, side walls, ceiling; skirting 6 in -->
<path class="ink" d="M200 680 L1400 680 L1400 140 L200 140 Z"/>
<line class="soft" x1="200" y1="650" x2="1400" y2="650"/>
<!-- the mural: a printed wall covering 6 to 48 in, x 24 to 168, one art wash, no frame, no imagery -->
<rect class="art" x="320" y="440" width="720" height="210"/>
<!-- two framed works 24 by 20 in, x 56 to 80 and 112 to 136, bottom 62, top 82; one cross on the pair's box at 72 in -->
<rect class="frame" x="480" y="270" width="120" height="100"/>
<rect class="art" x="496" y="286" width="88" height="68"/>
<rect class="frame" x="760" y="270" width="120" height="100"/>
<rect class="art" x="776" y="286" width="88" height="68"/>
<line class="dim" x1="658" y1="320" x2="702" y2="320" stroke-width="2"/>
<line class="dim" x1="680" y1="298" x2="680" y2="342" stroke-width="2"/>
<!-- eye band 57 and 60 in across the wall -->
<line class="eye" x1="200" y1="395" x2="1400" y2="395"/>
<line class="eye" x1="200" y1="380" x2="1400" y2="380"/>
<!-- child figure 44 in at the mural, head 7 in across, eye 4 in below the crown (40 in), drawn and never labelled -->
<circle class="soft" cx="650" cy="477.5" r="17.5"/>
<line class="soft" x1="650" y1="495" x2="650" y2="570"/>
<line class="soft" x1="650" y1="570" x2="634" y2="680"/>
<line class="soft" x1="650" y1="570" x2="666" y2="680"/>
<line class="soft" x1="650" y1="505" x2="628" y2="575"/>
<line class="soft" x1="650" y1="505" x2="672" y2="575"/>
<!-- standing adult 63 in, eye 58.5 in on the band, at x 200 -->
<circle class="soft" cx="1200" cy="391" r="26"/>
<line class="soft" x1="1200" y1="417" x2="1200" y2="510"/>
<line class="soft" x1="1200" y1="510" x2="1172" y2="680"/>
<line class="soft" x1="1200" y1="510" x2="1228" y2="680"/>
<line class="soft" x1="1200" y1="420" x2="1160" y2="515"/>
<line class="soft" x1="1200" y1="420" x2="1240" y2="515"/>
<!-- primaries: the band label at the band's left end above it; the mural label under the floor beneath the mural and the frames' label above the pair, because right of the mural and right of the pair the adult figure or the wall is in the way -->
<text class="l1" x="224" y="368">57 to 60 in</text>
<text class="l2" x="224" y="426">145 to 152 cm · adults standing</text>
<text class="l1" x="680" y="732" text-anchor="middle">mural at child height</text>
<text class="l2" x="680" y="762" text-anchor="middle">washable</text>
<text class="l1" x="680" y="246" text-anchor="middle">framed work above reach</text>
</svg>
