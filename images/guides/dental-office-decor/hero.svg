<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Plan of a dental practice with a patient's route from the door to the front desk, the waiting area, the corridor and a reclined chair in the operatory, with a sightline at each stop showing where the eye lands: the art behind the desk, the wall facing the waiting seats, the corridor sequence, and, from the chair, the ceiling and the upper wall ahead</title>
<desc id="d">Plan of a dental practice with a patient's route from the door to the front desk, the waiting area, the corridor and a reclined chair in the operatory, with a sightline at each stop showing where the eye lands: the art behind the desk, the wall facing the waiting seats, the corridor sequence, and, from the chair, the ceiling and the upper wall ahead</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5;stroke-opacity:1}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 3 px; plan, north wall at the top, entrance door in the south wall; practice 468 by 264 in, top left at (98, 104) -->
<!-- compact .lead 2.5 px at full opacity: the route must read at 400 px and in og.jpg (Curator check 2026-09-30) -->
<!-- exterior walls with the entrance door gap x 48 to 84 in the south wall -->
<path class="ink" d="M242 896 L98 896 L98 104 L1502 104 L1502 896 L350 896"/>
<!-- entrance door, 36 in, hinge at x 48, leaf and swing arc inward -->
<line class="soft" x1="242" y1="896" x2="242" y2="788"/>
<path class="soft" d="M350 896 A108 108 0 0 0 242 788"/>
<!-- interior walls: corridor south wall y 60 from x 144 to 336; operatory west wall x 336 with the door y 12 to 48; operatory south wall y 144; waiting partition x 252 from y 60 to 264 -->
<line class="ink" x1="530" y1="284" x2="1106" y2="284"/>
<line class="ink" x1="1106" y1="104" x2="1106" y2="140"/>
<line class="ink" x1="1106" y1="248" x2="1106" y2="536"/>
<line class="ink" x1="1106" y1="536" x2="1502" y2="536"/>
<line class="ink" x1="854" y1="284" x2="854" y2="896"/>
<!-- operatory door, 36 in, hinge at y 48 (south), leaf east, swing arc inward (same door as A3-D3) -->
<line class="soft" x1="1106" y1="248" x2="1214" y2="248"/>
<path class="soft" d="M1106 140 A108 108 0 0 1 1214 248"/>
<!-- front desk 96 by 30 in, x 24 to 120, y 72 to 102 -->
<rect class="soft" x="170" y="320" width="288" height="90"/>
<!-- benches 84 by 24 in, three seats of 28: A against the partition facing west, B facing east -->
<rect class="soft" x="782" y="518" width="72" height="252"/>
<line class="soft" x1="842" y1="518" x2="842" y2="770"/>
<line class="soft" x1="782" y1="602" x2="842" y2="602"/>
<line class="soft" x1="782" y1="686" x2="842" y2="686"/>
<rect class="soft" x="530" y="518" width="72" height="252"/>
<line class="soft" x1="542" y1="518" x2="542" y2="770"/>
<line class="soft" x1="542" y1="602" x2="602" y2="602"/>
<line class="soft" x1="542" y1="686" x2="602" y2="686"/>
<!-- chair 24 by 72 in, x 390 to 414, y 32 to 104, head to the north, rounded head end rx 16; headrest line at y 50 -->
<path class="soft" d="M1268 416 L1268 216 A16 16 0 0 1 1284 200 L1324 200 A16 16 0 0 1 1340 216 L1340 416 Z"/>
<line class="soft" x1="1268" y1="254" x2="1340" y2="254"/>
<!-- ceiling panel 24 by 48 in over the chair, x 390 to 414, y 60 to 108: dotted outline, never filled -->
<rect class="lead" x="1268" y="284" width="72" height="144"/>
<!-- the works, 12 px deep on the wall's inner face: desk wall 64 in; three corridor works of 24 in; waiting work 56 in on the partition's west face; wall ahead 40 in on the operatory south wall -->
<rect class="tp" x="218" y="104" width="192" height="12"/>
<rect class="tp" x="650" y="104" width="72" height="12"/>
<rect class="tp" x="782" y="104" width="72" height="12"/>
<rect class="tp" x="914" y="104" width="72" height="12"/>
<rect class="tp" x="842" y="560" width="12" height="168"/>
<rect class="tp" x="1244" y="524" width="120" height="12"/>
<!-- the route: door, front desk, bench B, around the corridor wall's open west end (x 144) to the corridor mouth, the operatory door, past the open leaf, the chair -->
<path class="lead" d="M296 860 L386 464 L566 644 L506 284 L548 194 L1106 194 L1238 194 L1304 314"/>
<!-- four sightlines from four anchors -->
<line class="eye" x1="296" y1="860" x2="314" y2="104"/>
<line class="eye" x1="578" y1="644" x2="854" y2="644"/>
<line class="eye" x1="548" y1="212" x2="818" y2="104"/>
<line class="eye" x1="1304" y1="230" x2="1304" y2="536"/>
<circle class="tp" cx="296" cy="860" r="3"/>
<circle class="tp" cx="578" cy="644" r="3"/>
<circle class="tp" cx="548" cy="212" r="3"/>
<circle class="tp" cx="1304" cy="230" r="3"/>
<!-- the four stops, numbered beside the anchors -->
<circle class="frame" cx="398" cy="846" r="34"/>
<text class="l1" x="398" y="846" text-anchor="middle" dominant-baseline="central">1</text>
<circle class="frame" cx="476" cy="656" r="34"/>
<text class="l1" x="476" y="656" text-anchor="middle" dominant-baseline="central">2</text>
<circle class="frame" cx="596" cy="242" r="34"/>
<text class="l1" x="596" y="242" text-anchor="middle" dominant-baseline="central">3</text>
<circle class="frame" cx="1388" cy="230" r="34"/>
<text class="l1" x="1388" y="230" text-anchor="middle" dominant-baseline="central">4</text>
<!-- secondaries -->
<text class="l2" x="296" y="936" text-anchor="middle">door</text>
<text class="l2" x="322.1" y="379.9">front desk</text>
<text class="l2" x="692" y="607" text-anchor="middle">waiting</text>
<text class="l2" x="998" y="248" text-anchor="middle">corridor</text>
<text class="l2" x="1187" y="406" text-anchor="middle">operatory</text>
<text class="l2" x="1354.1" y="367">ceiling panel</text>
<text class="l2" x="1304" y="576" text-anchor="middle">wall ahead</text>
</svg>
