<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Two elevations of the same large office wall: one work about two thirds of the wall's width, and a grid of six works with the same outer edge and the same center, both centered between the 57 and 60 inch lines</title>
<desc id="d">Two elevations of the same large office wall: one work about two thirds of the wall's width, and a grid of six works with the same outer edge and the same center, both centered between the 57 and 60 inch lines</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 3 px; floor at y=580; two panels of the same 192 by 108 in wall, panel 1 x 80 to 656, panel 2 x 944 to 1520 -->
<!-- both panels: wall outline to the 108 in ceiling, one shared floor, one shared band -->
<line class="ink" x1="80" y1="580" x2="1520" y2="580"/>
<rect class="ink" x="80" y="256" width="576" height="324"/>
<rect class="ink" x="944" y="256" width="576" height="324"/>
<line class="eye" x1="80" y1="409" x2="1520" y2="409"/>
<line class="eye" x1="80" y1="400" x2="1520" y2="400"/>
<!-- panel 1: one work 128 by 72 in, top 94 in, bottom 22 in, center 58 in; width bracket above the ceiling with leaders to the top corners -->
<rect class="frame" x="176" y="298" width="384" height="216"/>
<rect class="art" x="192" y="314" width="352" height="184"/>
<line class="dim" x1="346" y1="406" x2="390" y2="406" stroke-width="2"/>
<line class="dim" x1="368" y1="384" x2="368" y2="428" stroke-width="2"/>
<line class="dim" x1="176" y1="232" x2="560" y2="232"/>
<line class="dim" x1="176" y1="224" x2="176" y2="240"/>
<line class="dim" x1="560" y1="224" x2="560" y2="240"/>
<line class="lead" x1="176" y1="240" x2="176" y2="298"/>
<line class="lead" x1="560" y1="240" x2="560" y2="298"/>
<!-- panel 2: grid of six 40 by 34 in frames, gaps 4 in, group 128 by 72 in with the same edges and center; lead rectangle 10 px outside the group -->
<rect class="frame" x="1040" y="298" width="120" height="102"/>
<rect class="art" x="1052" y="310" width="96" height="78"/>
<rect class="frame" x="1040" y="412" width="120" height="102"/>
<rect class="art" x="1052" y="424" width="96" height="78"/>
<rect class="frame" x="1172" y="298" width="120" height="102"/>
<rect class="art" x="1184" y="310" width="96" height="78"/>
<rect class="frame" x="1172" y="412" width="120" height="102"/>
<rect class="art" x="1184" y="424" width="96" height="78"/>
<rect class="frame" x="1304" y="298" width="120" height="102"/>
<rect class="art" x="1316" y="310" width="96" height="78"/>
<rect class="frame" x="1304" y="412" width="120" height="102"/>
<rect class="art" x="1316" y="424" width="96" height="78"/>
<line class="dim" x1="1210" y1="406" x2="1254" y2="406" stroke-width="2"/>
<line class="dim" x1="1232" y1="384" x2="1232" y2="428" stroke-width="2"/>
<rect class="lead" x="1030" y="288" width="404" height="236"/>
<!-- labels -->
<text class="l1" x="368" y="630" text-anchor="middle">One work</text>
<text class="l1" x="1232" y="630" text-anchor="middle">A group, read as one</text>
<text class="l1" x="176" y="212">about two thirds of the wall<tspan class="l2"> · 128 of 192 in, 325 of 488 cm</tspan></text>
<text class="l1" x="800" y="388" text-anchor="middle">57 to 60 in<tspan class="l2" x="800" dy="50">145 to 152 cm</tspan></text>
<text class="l2" x="1232" y="556" text-anchor="middle">same outer edge, same center</text>
</svg>
