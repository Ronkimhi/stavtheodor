<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="t d">
<title id="t">Plan of a conference room with the screen on one end wall, windows on one long wall and one work on the solid long wall the chairs face across the table, and below it an elevation of that wall with the work centered below the 57 to 60 inch standing line and its bottom edge above the chair backs</title>
<desc id="d">Plan of a conference room with the screen on one end wall, windows on one long wall and one work on the solid long wall the chairs face across the table, and below it an elevation of that wall with the work centered below the 57 to 60 inch standing line and its bottom edge above the chair backs</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:64px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 3 px; plan above (room 216 by 144 in, north wall at the top, origin (476, 114)), elevation of the north wall below, floor at y=980, west on the left in both -->
<!-- plan: room outline with a 36 in door gap in the north wall (x 168 to 204), swing into the room -->
<path class="ink" d="M980 114 L476 114 L476 546 L1124 546 L1124 114 L1088 114"/>
<line class="soft" x1="1088" y1="114" x2="1088" y2="222"/>
<path class="soft" d="M1088 222 A108 108 0 0 1 980 114"/>
<!-- plan: work 80 in on the north wall (x 68 to 148), screen on the west wall, window across the south wall, table, eight chairs, four sightlines from the south chairs -->
<rect class="tp" x="680" y="114" width="240" height="12"/>
<rect class="soft" x="476" y="240" width="6" height="180"/>
<rect class="soft" x="584" y="540" width="432" height="12"/>
