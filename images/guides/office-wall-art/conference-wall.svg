<!-- labels: the band is the standing reference; the work sits below it with no number of its own -->
<text class="l1" x="464" y="338" text-anchor="end">screen: no art</text>
<text class="l1" x="800" y="60" text-anchor="middle">the wall they face</text>
<text class="l2" x="800" y="96" text-anchor="middle">anti-reflective glazing: it faces the window</text>
<text class="l2" x="800" y="580" text-anchor="middle">window</text>
<text class="l2" x="1034" y="770" text-anchor="middle">door</text>
<text class="l1" x="1136" y="812">57 to 60 in<tspan class="l2"> · 145 to 152 cm, standing</tspan></text>
<text class="l1" x="452" y="838" text-anchor="end">lower<tspan class="l2"> · test the center from a chair</tspan></text>
<line class="lead" x1="464" y1="830" x2="678" y2="830"/>
<text class="l2" x="452" y="880" text-anchor="end">clear of the chair backs</text>
<line class="lead" x1="464" y1="872" x2="640" y2="872"/>
</svg>
