<!-- elevation of the north wall from the window side: ceiling 108 in, door 84 in tall (x 980 to 1088), work 80 by 24 in, bottom 38 in, top 62 in, center at y 830 -->
<rect class="ink" x="476" y="656" width="648" height="324"/>
<path class="ink" d="M980 980 L980 728 L1088 728 L1088 980"/>
<line class="eye" x1="476" y1="809" x2="1124" y2="809"/>
