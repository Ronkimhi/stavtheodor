<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Four elevations on one floor line, with the 57 to 60 inch band across them: a work centered in the band on an open wall, then works two thirds the width of an 84 inch sofa, a 48 inch console and a queen headboard, hung 8 to 10, 6 to 10 and 8 to 10 inches above them, the last centered above the band because the headboard sets the height</title>
<desc id="d">Four elevations on one floor line, with the 57 to 60 inch band across them: a work centered in the band on an open wall, then works two thirds the width of an 84 inch sofa, a 48 inch console and a queen headboard, hung 8 to 10, 6 to 10 and 8 to 10 inches above them, the last centered above the band because the headboard sets the height</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:2.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 3.2 px; floor at y=580; four panels of 360 px from x 80 -->
<line class="ink" x1="80" y1="580" x2="1520" y2="580"/>
<line class="eye" x1="80" y1="397.6" x2="1520" y2="397.6"/>
<line class="eye" x1="80" y1="388" x2="1520" y2="388"/>
<!-- (a) open wall: work 40 by 30 in, bottom 43, top 73, center 58 -->
<rect class="frame" x="196" y="346.4" width="128" height="96"/>
<rect class="art" x="202" y="352.4" width="116" height="84"/>
<line class="dim" x1="238" y1="394.4" x2="282" y2="394.4" stroke-width="2"/>
<line class="dim" x1="260" y1="372.4" x2="260" y2="416.4" stroke-width="2"/>
<text class="l1" x="82" y="322">57 to 60 in<tspan class="l2"> · 145 to 152 cm</tspan></text>
<line class="lead" x1="100" y1="334" x2="100" y2="388"/>
<text class="l2" x="260" y="662" text-anchor="middle">open wall</text>
<!-- (b) sofa 84 in, back 32 in; work 56 by 38 in, bottom 41 (gap 9), top 79, center 60 -->
<rect class="soft" x="485.6" y="477.6" width="268.8" height="51.2"/>
<rect class="soft" x="485.6" y="528.8" width="268.8" height="19.2"/>
<rect class="soft" x="485.6" y="496.8" width="19.2" height="32"/>
<rect class="soft" x="735.2" y="496.8" width="19.2" height="32"/>
<line class="soft" x1="498.4" y1="548" x2="498.4" y2="580"/>
<line class="soft" x1="741.6" y1="548" x2="741.6" y2="580"/>
<rect class="frame" x="530.4" y="327.2" width="179.2" height="121.6"/>
<rect class="art" x="536.4" y="333.2" width="167.2" height="109.6"/>
<line class="dim" x1="598" y1="388" x2="642" y2="388" stroke-width="2"/>
<line class="dim" x1="620" y1="366" x2="620" y2="410" stroke-width="2"/>
<line class="dim" x1="723.6" y1="448.8" x2="723.6" y2="477.6"/>
<line class="dim" x1="715.6" y1="448.8" x2="731.6" y2="448.8"/>
<line class="dim" x1="715.6" y1="477.6" x2="731.6" y2="477.6"/>
<line class="dim" x1="530.4" y1="303.2" x2="709.6" y2="303.2"/>
<line class="dim" x1="530.4" y1="295.2" x2="530.4" y2="311.2"/>
<line class="dim" x1="709.6" y1="295.2" x2="709.6" y2="311.2"/>
<text class="l2" x="620" y="291.2" text-anchor="middle">two thirds</text>
<text class="l1" x="620" y="630" text-anchor="middle">8 to 10 in<tspan class="l2"> · 20 to 25 cm</tspan></text>
<text class="l2" x="620" y="662" text-anchor="middle">sofa, 84 in</text>
<!-- (c) console 48 by 34 in; work 32 wide by 36 tall, bottom 40 (gap 6), top 76, center 58 -->
<rect class="soft" x="903.2" y="471.2" width="153.6" height="108.8"/>
<line class="soft" x1="903.2" y1="477.6" x2="1056.8" y2="477.6"/>
<rect class="frame" x="928.8" y="336.8" width="102.4" height="115.2"/>
<rect class="art" x="934.8" y="342.8" width="90.4" height="103.2"/>
<line class="dim" x1="958" y1="394.4" x2="1002" y2="394.4" stroke-width="2"/>
<line class="dim" x1="980" y1="372.4" x2="980" y2="416.4" stroke-width="2"/>
<line class="dim" x1="1045.2" y1="452" x2="1045.2" y2="471.2"/>
<line class="dim" x1="1037.2" y1="452" x2="1053.2" y2="452"/>
<line class="dim" x1="1037.2" y1="471.2" x2="1053.2" y2="471.2"/>
<line class="dim" x1="928.8" y1="312.8" x2="1031.2" y2="312.8"/>
<line class="dim" x1="928.8" y1="304.8" x2="928.8" y2="320.8"/>
<line class="dim" x1="1031.2" y1="304.8" x2="1031.2" y2="320.8"/>
<text class="l2" x="980" y="300.8" text-anchor="middle">two thirds</text>
<text class="l1" x="980" y="630" text-anchor="middle">6 to 10 in<tspan class="l2"> · 15 to 25 cm</tspan></text>
<text class="l2" x="980" y="662" text-anchor="middle">console, 48 in</text>
<!-- (d) queen bed: headboard 60 in wide, top 44; mattress top 25; two pillows, top 40 in; work 40 by 26 in, bottom 53 (gap 9), top 79, center 66, above the band -->
<rect class="soft" x="1244" y="439.2" width="192" height="60.8"/>
<rect class="soft" x="1247.2" y="500" width="185.6" height="32"/>
<rect class="soft" x="1250.4" y="532" width="179.2" height="22.4"/>
<line class="soft" x1="1253.6" y1="554.4" x2="1253.6" y2="580"/>
<line class="soft" x1="1426.4" y1="554.4" x2="1426.4" y2="580"/>
<rect class="soft" x="1250.4" y="452" width="86.4" height="48" rx="12"/>
<rect class="soft" x="1343.2" y="452" width="86.4" height="48" rx="12"/>
<rect class="frame" x="1276" y="327.2" width="128" height="83.2"/>
<rect class="art" x="1282" y="333.2" width="116" height="71.2"/>
<line class="dim" x1="1318" y1="368.8" x2="1362" y2="368.8" stroke-width="2"/>
<line class="dim" x1="1340" y1="346.8" x2="1340" y2="390.8" stroke-width="2"/>
<line class="dim" x1="1418" y1="410.4" x2="1418" y2="439.2"/>
<line class="dim" x1="1410" y1="410.4" x2="1426" y2="410.4"/>
<line class="dim" x1="1410" y1="439.2" x2="1426" y2="439.2"/>
<line class="dim" x1="1276" y1="303.2" x2="1404" y2="303.2"/>
<line class="dim" x1="1276" y1="295.2" x2="1276" y2="311.2"/>
<line class="dim" x1="1404" y1="295.2" x2="1404" y2="311.2"/>
<text class="l2" x="1340" y="291.2" text-anchor="middle">two thirds</text>
<text class="l2" x="1340" y="261.2" text-anchor="middle">the headboard sets the height</text>
<text class="l1" x="1340" y="630" text-anchor="middle">8 to 10 in<tspan class="l2"> · 20 to 25 cm</tspan></text>
<text class="l2" x="1340" y="662" text-anchor="middle">queen headboard, 60 in</text>
</svg>
