<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">A line of seven steps from the first conversation to the art on the wall: discovery, research, curatorial development, budget planning, art procurement and selection, logistics and installation; three of them end with a decision that is the client's alone: the direction, the range and the works.</title>
<desc id="d">A line of seven steps from the first conversation to the art on the wall: discovery, research, curatorial development, budget planning, art procurement and selection, logistics and installation; three of them end with a decision that is the client's alone: the direction, the range and the works.</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none (schematic); seven steps 220 px apart on one line at y 330, x 140 to 1460; the three decision steps carry the wash -->
<line class="ink" x1="140" y1="330" x2="1460" y2="330"/>
<!-- Discovery -->
<rect class="frame" x="126" y="316" width="28" height="28"/>
<text class="l2" x="140" y="390" text-anchor="middle">Discovery</text>
<!-- Research -->
<rect class="frame" x="346" y="316" width="28" height="28"/>
<text class="l2" x="360" y="390" text-anchor="middle">Research</text>
<!-- Curatorial development: a decision that is the client's -->
<line class="lead" x1="580" y1="182" x2="580" y2="308"/>
<text class="l1" x="580" y="170" text-anchor="middle">The direction</text>
<rect class="frame" x="558" y="308" width="44" height="44"/>
<rect class="art" x="564" y="314" width="32" height="32"/>
<text class="l2" x="580" y="390" text-anchor="middle">Curatorial</text>
<text class="l2" x="580" y="418" text-anchor="middle">development</text>
<!-- Budget planning: a decision that is the client's -->
<line class="lead" x1="800" y1="262" x2="800" y2="308"/>
<text class="l1" x="800" y="250" text-anchor="middle">The range</text>
<rect class="frame" x="778" y="308" width="44" height="44"/>
<rect class="art" x="784" y="314" width="32" height="32"/>
<text class="l2" x="800" y="390" text-anchor="middle">Budget</text>
<text class="l2" x="800" y="418" text-anchor="middle">planning</text>
<!-- Art procurement and selection: a decision that is the client's -->
<line class="lead" x1="1020" y1="182" x2="1020" y2="308"/>
<text class="l1" x="1020" y="170" text-anchor="middle">The works</text>
<rect class="frame" x="998" y="308" width="44" height="44"/>
<rect class="art" x="1004" y="314" width="32" height="32"/>
<text class="l2" x="1020" y="390" text-anchor="middle">Art procurement</text>
<text class="l2" x="1020" y="418" text-anchor="middle">and selection</text>
<!-- Logistics -->
<rect class="frame" x="1226" y="316" width="28" height="28"/>
<text class="l2" x="1240" y="390" text-anchor="middle">Logistics</text>
<!-- Installation -->
<rect class="frame" x="1446" y="316" width="28" height="28"/>
<text class="l2" x="1460" y="390" text-anchor="middle">Installation</text>
<circle class="tp" cx="140" cy="330" r="3"/>
<text class="l1" x="100" y="490">First conversation</text>
<text class="l1" x="1500" y="490" text-anchor="end">Art on the wall</text>
</svg>
