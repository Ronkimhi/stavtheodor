<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Comparison drawing of two overlapping columns: an art advisor, who works for a buyer and a collection, and an art consultant, who works for a space such as an office, a hotel or a home, compared by who hires, what is delivered and whom each represents; where the columns overlap, one curator does both.</title>
<desc id="d">Comparison drawing of two overlapping columns: an art advisor, who works for a buyer and a collection, and an art consultant, who works for a space such as an office, a hotel or a home, compared by who hires, what is delivered and whom each represents; where the columns overlap, one curator does both.</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:46px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none (schematic); two 920 px columns x 80 to 1000 and x 600 to 1520 overlapping 400 px, y 100 to 940; header band y 100 to 240; rows of 240 -->
<!-- compact .l1 46 px, not 52: "Whom they represent" at 52 px crosses the overlap column at x 600 (Curator check 2026-09-29) -->
<!-- the overlap, the subject: one curator doing both -->
<rect class="art" x="600" y="100" width="400" height="840"/>
<!-- the two columns -->
<rect class="ink" x="80" y="100" width="920" height="840"/>
<rect class="ink" x="600" y="100" width="920" height="840"/>
<!-- header line and row separators -->
<line class="ink" x1="80" y1="240" x2="1520" y2="240"/>
<line class="soft" x1="80" y1="480" x2="1520" y2="480"/>
<line class="soft" x1="80" y1="720" x2="1520" y2="720"/>
<!-- header: the two roles and the overlap -->
<text class="l1" x="340" y="172" text-anchor="middle">Art advisor</text>
<text class="l2" x="340" y="208" text-anchor="middle">a buyer, a collection</text>
<text class="l1" x="800" y="172" text-anchor="middle">Both<tspan class="l2"> · one curator</tspan></text>
<text class="l2" x="800" y="208" text-anchor="middle">the space first, then the work</text>
<text class="l1" x="1260" y="172" text-anchor="middle">Art consultant</text>
<text class="l2" x="1260" y="208" text-anchor="middle">a space: an office, a home</text>
<!-- row: Who hires -->
<text class="l1" x="104" y="292">Who hires</text>
<text class="l2" x="104" y="344">A buyer, usually a</text>
<text class="l2" x="104" y="376">private collector</text>
<text class="l2" x="800" y="344" text-anchor="middle">A person, a family</text>
<text class="l2" x="800" y="376" text-anchor="middle">or a business</text>
<text class="l2" x="1024" y="344">A firm, a practice, a hotel,</text>
<text class="l2" x="1024" y="376">a restaurant or a homeowner</text>
<!-- row: What is delivered -->
<text class="l1" x="104" y="532">What is delivered</text>
<text class="l2" x="104" y="584">Works found, assessed</text>
<text class="l2" x="104" y="616">and negotiated, a collection</text>
<text class="l2" x="104" y="648">that grows with its owner</text>
<text class="l2" x="800" y="584" text-anchor="middle">The space read first,</text>
<text class="l2" x="800" y="616" text-anchor="middle">then the work chosen,</text>
<text class="l2" x="800" y="648" text-anchor="middle">until it is on the wall</text>
<text class="l2" x="1024" y="584">A plan for every wall,</text>
<text class="l2" x="1024" y="616">sourced, framed</text>
<text class="l2" x="1024" y="648">and installed</text>
<!-- row: Whom they represent -->
<text class="l1" x="104" y="772">Whom they represent</text>
<text class="l2" x="104" y="824">The buyer. Ask whether</text>
<text class="l2" x="104" y="856">they hold stock</text>
<text class="l2" x="800" y="824" text-anchor="middle">The client, not the artist:</text>
<text class="l2" x="800" y="856" text-anchor="middle">no closed roster</text>
<text class="l2" x="1024" y="824">The client. Some work from</text>
<text class="l2" x="1024" y="856">a gallery's or supplier's stock</text>
</svg>
