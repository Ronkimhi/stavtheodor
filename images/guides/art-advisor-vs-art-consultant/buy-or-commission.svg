<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Decision drawing: if the right work for the space exists, it is found, assessed, negotiated and acquired, an advisor's job; if it does not exist yet, an artist makes it for that one space, a consultant's job; both paths end with the work framed, delivered and installed on the wall.</title>
<desc id="d">Decision drawing: if the right work for the space exists, it is found, assessed, negotiated and acquired, an advisor's job; if it does not exist yet, an artist makes it for that one space, a consultant's job; both paths end with the work framed, delivered and installed on the wall.</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none (schematic); start station x 90 to 470, branches x 590 to 1110 at y 150 and 510, end station x 1180 to 1520; all 140 tall -->
<!-- connectors, no arrowheads: an elbow out of the start, an elbow into the end -->
<path class="ink" d="M470 400 H530 V220 H590"/>
<path class="ink" d="M530 400 V580 H590"/>
<path class="ink" d="M1110 220 H1145 V400 H1180"/>
<path class="ink" d="M1110 580 H1145 V400"/>
<!-- start -->
<rect class="ink" x="90" y="330" width="380" height="140"/>
<circle class="tp" cx="90" cy="400" r="3"/>
<text class="l1" x="280" y="392" text-anchor="middle">Does it exist?</text>
<text class="l2" x="280" y="432" text-anchor="middle">the right work for this space</text>
<!-- upper branch: acquire -->
<rect class="ink" x="590" y="150" width="520" height="140"/>
<text class="l1" x="850" y="198" text-anchor="middle">Yes: acquire it</text>
<text class="l2" x="850" y="234" text-anchor="middle">found, assessed, negotiated</text>
<text class="l2" x="850" y="266" text-anchor="middle">an advisor's job</text>
<!-- lower branch: commission -->
<rect class="ink" x="590" y="510" width="520" height="140"/>
<text class="l1" x="850" y="558" text-anchor="middle">No: commission it</text>
<text class="l2" x="850" y="594" text-anchor="middle">made by an artist for that space</text>
<text class="l2" x="850" y="626" text-anchor="middle">a consultant's job</text>
<!-- end, the subject: the work on the wall -->
<rect class="art" x="1196" y="346" width="308" height="108"/>
<rect class="ink" x="1180" y="330" width="340" height="140"/>
<text class="l1" x="1350" y="392" text-anchor="middle">On the wall</text>
<text class="l2" x="1350" y="432" text-anchor="middle">framed, delivered, installed</text>
</svg>
