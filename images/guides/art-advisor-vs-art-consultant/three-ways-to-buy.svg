<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Three ways to buy the same work: at auction, many bidders compete for it; through a gallery, which represents its artists and carries its space, its inventory and its gallerists; through a private curator, who stands on the buyer's side and can reach out to any artist.</title>
<desc id="d">Three ways to buy the same work: at auction, many bidders compete for it; through a gallery, which represents its artists and carries its space, its inventory and its gallerists; through a private curator, who stands on the buyer's side and can reach out to any artist.</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none (schematic); three panels 440 wide at x 80, 580 and 1080, no borders; the same work 160 by 120 in each -->
<!-- panel one, auction: eight bidders on a lower arc, every sightline converging on one work -->
<line class="eye" x1="490.5" y1="410" x2="300" y2="360"/>
<circle class="tp" cx="490.5" cy="410" r="6"/>
<line class="eye" x1="450" y1="460.9" x2="300" y2="360"/>
<circle class="tp" cx="450" cy="460.9" r="6"/>
<line class="eye" x1="396.4" y1="497.7" x2="300" y2="360"/>
<circle class="tp" cx="396.4" cy="497.7" r="6"/>
<line class="eye" x1="334.4" y1="517.3" x2="300" y2="360"/>
<circle class="tp" cx="334.4" cy="517.3" r="6"/>
<line class="eye" x1="265.6" y1="517.3" x2="300" y2="360"/>
<circle class="tp" cx="265.6" cy="517.3" r="6"/>
<line class="eye" x1="203.6" y1="497.7" x2="300" y2="360"/>
<circle class="tp" cx="203.6" cy="497.7" r="6"/>
<line class="eye" x1="150" y1="460.9" x2="300" y2="360"/>
<circle class="tp" cx="150" cy="460.9" r="6"/>
<line class="eye" x1="109.5" y1="410" x2="300" y2="360"/>
<circle class="tp" cx="109.5" cy="410" r="6"/>
<rect class="frame" x="220" y="240" width="160" height="120"/>
<rect class="art" x="236" y="256" width="128" height="88"/>
<text class="l2" x="300" y="600" text-anchor="middle">many bidders compete for one work</text>
<text class="l1" x="300" y="820" text-anchor="middle">Auction</text>
<!-- panel two, gallery: an enclosure holding its roster, the work, its space, inventory and gallerists; you outside -->
<text class="l2" x="800" y="130" text-anchor="middle">represents its artists</text>
<line class="soft" x1="870" y1="560" x2="870" y2="320"/>
<rect class="ink" x="600" y="150" width="400" height="320"/>
<text class="l2" x="680" y="190" text-anchor="middle">its artists</text>
<rect class="ink" x="620" y="204" width="120" height="120"/>
<rect class="frame" x="632" y="216" width="40" height="40"/>
<rect class="frame" x="688" y="216" width="40" height="40"/>
<rect class="frame" x="632" y="272" width="40" height="40"/>
<rect class="frame" x="688" y="272" width="40" height="40"/>
<rect class="frame" x="820" y="200" width="160" height="120"/>
<rect class="art" x="836" y="216" width="128" height="88"/>
<rect class="soft" x="620" y="390" width="110" height="60"/>
<text class="l2" x="675" y="428" text-anchor="middle">space</text>
<rect class="soft" x="750" y="390" width="110" height="60"/>
<text class="l2" x="805" y="428" text-anchor="middle">inventory</text>
<rect class="soft" x="880" y="390" width="110" height="60"/>
<text class="l2" x="935" y="428" text-anchor="middle">gallerists</text>
<circle class="tp" cx="870" cy="560" r="6"/>
<text class="l2" x="888" y="568">you</text>
<text class="l1" x="800" y="820" text-anchor="middle">Gallery</text>
<!-- panel three, private curator: curator and you side by side, one bracket under both; open to any artist -->
<text class="l2" x="1300" y="130" text-anchor="middle">open to any artist</text>
<line class="lead" x1="1250" y1="560" x2="1110" y2="250"/>
<line class="lead" x1="1250" y1="560" x2="1490" y2="250"/>
<line class="lead" x1="1250" y1="560" x2="1120" y2="420"/>
<line class="lead" x1="1250" y1="560" x2="1480" y2="420"/>
<rect class="frame" x="1080" y="227.5" width="60" height="45"/>
<rect class="frame" x="1460" y="227.5" width="60" height="45"/>
<rect class="frame" x="1090" y="397.5" width="60" height="45"/>
<rect class="frame" x="1450" y="397.5" width="60" height="45"/>
<line class="soft" x1="1250" y1="560" x2="1250" y2="360"/>
<rect class="frame" x="1220" y="240" width="160" height="120"/>
<rect class="art" x="1236" y="256" width="128" height="88"/>
<circle class="tp" cx="1250" cy="560" r="6"/>
<circle class="tp" cx="1350" cy="560" r="6"/>
<text class="l2" x="1250" y="594" text-anchor="middle">curator</text>
<text class="l2" x="1350" y="594" text-anchor="middle">you</text>
<line class="dim" x1="1220" y1="610" x2="1380" y2="610"/>
<line class="dim" x1="1220" y1="602" x2="1220" y2="618"/>
<line class="dim" x1="1380" y1="602" x2="1380" y2="618"/>
<text class="l2" x="1300" y="646" text-anchor="middle">represents you</text>
<text class="l1" x="1300" y="820" text-anchor="middle">Private curator</text>
</svg>
