<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Decision diagram: where guests stop, an original if the right work exists, or a commission if it has to be made; where guests pass, a limited edition, never an open edition decor print</title>
<desc id="d">Decision diagram: where guests stop, an original if the right work exists, or a commission if it has to be made; where guests pass, a limited edition, never an open edition decor print</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5;stroke-opacity:1}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none (a diagram of choices, as home D26); all frames one size, 180 by 135; root (200,400), node (600,250) -->
<!-- compact .lead 2.5 px at full opacity: the Commission's dotted outline must read at 360 (Curator check 2026-09-30) -->
<!-- the root and the two branches -->
<line class="soft" x1="200" y1="400" x2="600" y2="250"/>
<line class="soft" x1="600" y1="250" x2="980" y2="167.5"/>
<line class="soft" x1="600" y1="250" x2="980" y2="367.5"/>
<line class="soft" x1="200" y1="400" x2="980" y2="587.5"/>
<circle class="tp" cx="200" cy="400" r="6"/>
<circle class="tp" cx="600" cy="250" r="6"/>
<!-- Original: a unique work -->
<rect class="frame" x="980" y="100" width="180" height="135"/>
<rect class="art" x="996" y="116" width="148" height="103"/>
<!-- Commission: the same outline in .lead, a work still to be made, with the art wash inside -->
<rect class="art" x="996" y="316" width="148" height="103"/>
<rect class="lead" x="980" y="300" width="180" height="135"/>
<!-- Edition: a stack of three, the two behind offset 14 px right and up each -->
<rect class="frame" x="1008" y="492" width="180" height="135"/>
<rect class="art" x="1024" y="508" width="148" height="103"/>
<rect class="frame" x="994" y="506" width="180" height="135"/>
<rect class="art" x="1010" y="522" width="148" height="103"/>
<rect class="frame" x="980" y="520" width="180" height="135"/>
<rect class="art" x="996" y="536" width="148" height="103"/>
<!-- the avoided case: an open edition decor print, struck corner to corner -->
<rect class="frame" x="600" y="600" width="120" height="90"/>
<rect class="art" x="616" y="616" width="88" height="58"/>
<line class="ink" x1="600" y1="690" x2="720" y2="600" stroke-width="3"/>
<!-- labels -->
<text class="l1" x="380" y="226" text-anchor="middle">Where guests stop<tspan class="l2" x="380" dy="34">lobby, bar, suites</tspan></text>
<text class="l1" x="420" y="566" text-anchor="middle">Where guests pass<tspan class="l2" x="420" dy="34">corridors, guest rooms</tspan></text>
<text class="l1" x="1200" y="176.5">Original</text>
<text class="l2" x="1200" y="212">a unique work</text>
<text class="l1" x="1200" y="376.5">Commission</text>
<text class="l2" x="1200" y="412">an original made</text>
<text class="l2" x="1200" y="442">for the property</text>
<text class="l1" x="1200" y="596.5">Edition</text>
<text class="l2" x="1200" y="632">limited and numbered</text>
<text class="l2" x="660" y="726" text-anchor="middle">never an open edition decor print</text>
<text class="l2" x="300" y="448" text-anchor="end">a wall on the schedule</text>
<text class="l2" x="787" y="188.9" text-anchor="middle" transform="rotate(-12.25 787 188.9)">the right work exists</text>
<text class="l2" x="781" y="342.5" text-anchor="middle" transform="rotate(17.18 781 342.5)">it has to be made</text>
</svg>
