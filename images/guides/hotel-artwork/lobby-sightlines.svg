<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Plan of a hotel lobby: sightlines from the entry doors, the front of the reception desk and the seating all meet at one large arrival piece on the wall facing the doors, while the wall behind the desk sits behind the staff and the queue</title>
<desc id="d">Plan of a hotel lobby: sightlines from the entry doors, the front of the reception desk and the seating all meet at one large arrival piece on the wall facing the doors, while the wall behind the desk sits behind the staff and the queue</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5;stroke-opacity:1}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 1.6 px; plan of the HT1 lobby, 480 by 360 in, inner north west corner at (416,212); no floor line -->
<!-- compact .lead 2.5 px at full opacity: the desk wall marker and the blocked view must read at 360 (Curator check 2026-09-30) -->
<line class="ink" x1="416" y1="212" x2="454.4" y2="212"/>
<line class="ink" x1="569.6" y1="212" x2="1030.4" y2="212"/>
<line class="ink" x1="1145.6" y1="212" x2="1184" y2="212"/>
<line class="ink" x1="416" y1="788" x2="742.4" y2="788"/>
<line class="ink" x1="857.6" y1="788" x2="1184" y2="788"/>
<line class="ink" x1="416" y1="212" x2="416" y2="788"/>
<line class="soft" x1="742.4" y1="788" x2="742.4" y2="730.4"/>
<path class="soft" d="M742.4 730.4 A57.6 57.6 0 0 1 800 788"/>
<line class="soft" x1="857.6" y1="788" x2="857.6" y2="730.4"/>
<path class="soft" d="M857.6 730.4 A57.6 57.6 0 0 0 800 788"/>
<rect class="tp" x="646.4" y="212" width="307.2" height="12"/>
<rect class="soft" x="512" y="384.8" width="48" height="230.4"/>
<rect class="soft" x="953.6" y="576.8" width="134.4" height="57.6"/>
<rect class="soft" x="953.6" y="621.6" width="134.4" height="12.8"/>
<rect class="soft" x="953.6" y="576.8" width="9.6" height="44.8"/>
<rect class="soft" x="1078.4" y="576.8" width="9.6" height="44.8"/>
<rect class="soft" x="896" y="500" width="51.2" height="51.2" rx="6"/>
<rect class="soft" x="1094.4" y="500" width="51.2" height="51.2" rx="6"/>
<line class="ink" x1="1184" y1="212" x2="1184" y2="557.6"/>
<line class="ink" x1="1184" y1="711.2" x2="1184" y2="788"/>
<!-- desk wall marker: a candidate wall, .lead, no taupe fill -->
<rect class="lead" x="416" y="384.8" width="12" height="230.4"/>
<!-- staff behind the desk, a queue in front of it: head circles 20 in across -->
<circle class="soft" cx="464" cy="452" r="16"/>
<circle class="soft" cx="464" cy="548" r="16"/>
<circle class="soft" cx="592" cy="532" r="16"/>
<circle class="soft" cx="592" cy="583.2" r="16"/>
<circle class="soft" cx="592" cy="634.4" r="16"/>
<circle class="soft" cx="592" cy="685.6" r="16"/>
<!-- three sightlines to the arrival piece's center (240,0), anchor dots at their starts -->
<line class="eye" x1="800" y1="788" x2="800" y2="212"/>
<line class="eye" x1="592" y1="532" x2="800" y2="212"/>
<line class="eye" x1="1020.8" y1="605.6" x2="800" y2="212"/>
<circle class="tp" cx="800" cy="788" r="6"/>
<circle class="tp" cx="592" cy="532" r="6"/>
<circle class="tp" cx="1020.8" cy="605.6" r="6"/>
<!-- the blocked view: doors to the desk wall's center, through the queue, the desk and the staff -->
<line class="lead" x1="800" y1="788" x2="416" y2="500"/>
<!-- labels -->
<text class="l1" x="800" y="186" text-anchor="middle">arrival piece</text>
<text class="l1" x="396" y="500" text-anchor="end">desk wall</text>
<text class="l2" x="396" y="534" text-anchor="end">hidden by staff and the queue</text>
<text class="l2" x="396" y="564" text-anchor="end">a work here must clear their heads</text>
<text class="l2" x="870" y="770">from the doors</text>
<text class="l2" x="616" y="540">from the desk</text>
<text class="l2" x="1020.8" y="672" text-anchor="middle">from the seating</text>
<text class="l2" x="800" y="824" text-anchor="middle">entry</text>
<text class="l2" x="536" y="366" text-anchor="middle">reception desk</text>
<text class="l2" x="464" y="420" text-anchor="middle">staff</text>
<text class="l2" x="592" y="728" text-anchor="middle">queue</text>
<text class="l2" x="1088" y="190" text-anchor="middle">elevators</text>
<text class="l2" x="1200" y="640">to the restaurant and bar</text>
</svg>
