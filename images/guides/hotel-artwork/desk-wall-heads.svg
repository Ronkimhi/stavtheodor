<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Two elevations of the wall behind a hotel reception desk: the same work hung on the 57 to 60 inch eye level band sits behind the heads of the staff and the queue, and hung above their heads it stays in view from the doors</title>
<desc id="d">Two elevations of the wall behind a hotel reception desk: the same work hung on the 57 to 60 inch eye level band sits behind the heads of the staff and the queue, and hung above their heads it stays in view from the doors</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:40px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; floor at y=680; two elevations of the 144 in desk wall, (a) x 80 to 656, (b) x 784 to 1360; wall edges to 132 in; work 96 by 30, (a) bottom 43.5, (b) bottom 72 -->
<!-- compact .l1 40 px, not 52: "57 to 60 in" from x 1372 would run past the 1600 edge; 44 is the largest that keeps 12 px (Curator check 2026-09-30) -->
<line class="ink" x1="80" y1="680" x2="656" y2="680"/>
<!-- the wall's two edges, floor to 132 in -->
<line class="ink" x1="80" y1="680" x2="80" y2="152"/>
<line class="ink" x1="656" y1="680" x2="656" y2="152"/>
<!-- reception desk front, a 42 in transaction counter (drawing choice, never labelled) -->
<rect class="soft" x="80" y="512" width="576" height="168"/>
<line class="soft" x1="80" y1="520" x2="656" y2="520"/>
<!-- the work: 96 by 30, x 24 to 120, bottom 43.5, center 58.5 -->
<rect class="frame" x="176" y="386" width="384" height="120"/>
