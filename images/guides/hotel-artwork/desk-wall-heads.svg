<line class="soft" x1="784" y1="520" x2="1360" y2="520"/>
<!-- the work: 96 by 30, x 24 to 120, bottom 72, center 87 -->
<rect class="frame" x="880" y="272" width="384" height="120"/>
<rect class="art" x="896" y="288" width="352" height="88"/>
<line class="dim" x1="1050" y1="332" x2="1094" y2="332" stroke-width="2"/>
<line class="dim" x1="1072" y1="310" x2="1072" y2="354" stroke-width="2"/>
<!-- the eye band across both panels -->
<line class="eye" x1="80" y1="452" x2="1360" y2="452"/>
<line class="eye" x1="80" y1="440" x2="1360" y2="440"/>
