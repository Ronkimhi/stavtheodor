<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Front elevation of a king bed in a guest room: the work above it is two thirds of the headboard's width and hangs 8 to 10 inches above it, glazed with acrylic, and the back of the frame shows two fixing points with security hardware</title>
<desc id="d">Front elevation of a king bed in a guest room: the work above it is two thirds of the headboard's width and hangs 8 to 10 inches above it, glazed with acrylic, and the back of the frame shows two fixing points with security hardware</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 6 px (as home D20 and D21); floor at y=680; elevation x origin at px 140; frame back at px 1060 to 1360 -->
<line class="ink" x1="80" y1="680" x2="1520" y2="680"/>
<!-- nightstands 22 by 24; king bed 76 wide, headboard top 44, mattress top 25, pillows 36 wide to 40 in -->
<rect class="soft" x="140" y="536" width="132" height="144"/>
<rect class="soft" x="752" y="536" width="132" height="144"/>
<rect class="soft" x="284" y="416" width="456" height="114"/>
<rect class="soft" x="290" y="530" width="444" height="60"/>
<rect class="soft" x="296" y="590" width="432" height="42"/>
<line class="soft" x1="302" y1="632" x2="302" y2="680"/>
<line class="soft" x1="722" y1="632" x2="722" y2="680"/>
<rect class="soft" x="290" y="440" width="216" height="90" rx="14"/>
<rect class="soft" x="518" y="440" width="216" height="90" rx="14"/>
<!-- the work: 50 by 30, bottom 53, center 68 -->
<rect class="frame" x="362" y="182" width="300" height="180"/>
<rect class="art" x="378" y="198" width="268" height="148"/>
<line class="dim" x1="490" y1="272" x2="534" y2="272" stroke-width="2"/>
<line class="dim" x1="512" y1="250" x2="512" y2="294" stroke-width="2"/>
<line class="dim" x1="362" y1="152" x2="662" y2="152"/>
<line class="dim" x1="362" y1="144" x2="362" y2="160"/>
<line class="dim" x1="662" y1="144" x2="662" y2="160"/>
<line class="dim" x1="284" y1="700" x2="740" y2="700"/>
<line class="dim" x1="284" y1="692" x2="284" y2="708"/>
<line class="dim" x1="740" y1="692" x2="740" y2="708"/>
<line class="dim" x1="680" y1="362" x2="680" y2="416"/>
<line class="dim" x1="672" y1="362" x2="688" y2="362"/>
<line class="dim" x1="672" y1="416" x2="688" y2="416"/>
<!-- back of the same frame: two security hangers 4 in in from the sides, 8 in below the top, 42 in apart -->
<rect class="frame" x="1060" y="182" width="300" height="180"/>
<rect class="soft" x="1074" y="196" width="272" height="152"/>
<circle class="ink" cx="1084" cy="230" r="3"/>
<rect class="ink" x="1072" y="211" width="24" height="14"/>
<circle class="ink" cx="1084" cy="230" r="8"/>
<circle class="ink" cx="1336" cy="230" r="3"/>
<rect class="ink" x="1324" y="211" width="24" height="14"/>
<circle class="ink" cx="1336" cy="230" r="8"/>
<!-- labels -->
<text class="l1" x="512" y="106" text-anchor="middle">two thirds of the headboard<tspan class="l2" x="512" dy="34">50 in, 127 cm</tspan></text>
<text class="l1" x="694" y="398">8 to 10 in<tspan class="l2"> · 20 to 25 cm</tspan></text>
<text class="l1" x="1210" y="418" text-anchor="middle">two points<tspan class="l2" x="1210" dy="34">security hardware, never one nail</tspan></text>
<text class="l2" x="512" y="742" text-anchor="middle">76 in king headboard, 193 cm</text>
<text class="l2" x="348" y="268" text-anchor="end">acrylic, not glass</text>
<text class="l2" x="1210" y="160" text-anchor="middle">back of the frame</text>
</svg>
