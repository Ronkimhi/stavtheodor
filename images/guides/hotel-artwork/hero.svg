<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Plan diagram of a hotel art program in five zones: the lobby with one large arrival piece at the end of the entry sightline, the restaurant and bar with one work, a corridor with works at a steady interval between the room doors, guest rooms with one work above each bed, and a suite with originals, each zone labelled with its usual approach: original, commission or edition</title>
<desc id="d">Plan diagram of a hotel art program in five zones: the lobby with one large arrival piece at the end of the entry sightline, the restaurant and bar with one work, a corridor with works at a steady interval between the room doors, guest rooms with one work above each bed, and a suite with originals, each zone labelled with its usual approach: original, commission or edition</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
