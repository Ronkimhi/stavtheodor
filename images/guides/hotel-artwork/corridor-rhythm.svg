<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Elevation of a hotel corridor wall: one framed work in each stretch of wall between room doors, at a steady interval, every center on the same eye level line of 57 to 60 inches</title>
<desc id="d">Elevation of a hotel corridor wall: one framed work in each stretch of wall between room doors, at a steady interval, every center on the same eye level line of 57 to 60 inches</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 2 px; floor at y=580; corridor wall x 0 to 560 in (px 80 to 1200); no ceiling drawn -->
<line class="ink" x1="80" y1="580" x2="1200" y2="580"/>
<!-- opening to the elevator lobby x 0 to 48, its jamb 96 in tall -->
<line class="ink" x1="176" y1="580" x2="176" y2="388"/>
<!-- three room doors 36 by 80, a handle mark on each -->
<rect class="ink" x="416" y="420" width="72" height="160"/>
<circle class="ink" cx="480" cy="504" r="3"/>
<rect class="ink" x="728" y="420" width="72" height="160"/>
<circle class="ink" cx="792" cy="504" r="3"/>
<rect class="ink" x="1040" y="420" width="72" height="160"/>
<circle class="ink" cx="1104" cy="504" r="3"/>
<!-- three 24 by 36 frames centered in each 120 in stretch of wall, centers 58 in -->
<rect class="frame" x="272" y="428" width="48" height="72"/>
<rect class="art" x="280" y="436" width="32" height="56"/>
<line class="dim" x1="274" y1="464" x2="318" y2="464" stroke-width="2"/>
<line class="dim" x1="296" y1="442" x2="296" y2="486" stroke-width="2"/>
<rect class="frame" x="584" y="428" width="48" height="72"/>
<rect class="art" x="592" y="436" width="32" height="56"/>
<line class="dim" x1="586" y1="464" x2="630" y2="464" stroke-width="2"/>
<line class="dim" x1="608" y1="442" x2="608" y2="486" stroke-width="2"/>
<rect class="frame" x="896" y="428" width="48" height="72"/>
<rect class="art" x="904" y="436" width="32" height="56"/>
<line class="dim" x1="898" y1="464" x2="942" y2="464" stroke-width="2"/>
<line class="dim" x1="920" y1="442" x2="920" y2="486" stroke-width="2"/>
<line class="eye" x1="80" y1="466" x2="1200" y2="466"/>
<line class="eye" x1="80" y1="460" x2="1200" y2="460"/>
<!-- two equal intervals at 88 in, no number -->
<line class="dim" x1="296" y1="404" x2="608" y2="404"/>
<line class="dim" x1="296" y1="396" x2="296" y2="412"/>
<line class="dim" x1="608" y1="396" x2="608" y2="412"/>
<line class="dim" x1="608" y1="404" x2="920" y2="404"/>
<line class="dim" x1="608" y1="396" x2="608" y2="412"/>
<line class="dim" x1="920" y1="396" x2="920" y2="412"/>
<circle class="soft" cx="128" cy="480" r="26"/>
<line class="soft" x1="128" y1="506" x2="128" y2="512"/>
<line class="soft" x1="128" y1="512" x2="118" y2="580"/>
<line class="soft" x1="128" y1="512" x2="150" y2="580"/>
<line class="soft" x1="128" y1="510" x2="162" y2="508"/>
<!-- labels -->
<text class="l1" x="1212" y="448">57 to 60 in</text>
<text class="l2" x="1212" y="478">145 to 152 cm</text>
<text class="l2" x="1212" y="508">one line for the whole run</text>
<text class="l1" x="452" y="382" text-anchor="middle">steady interval</text>
<text class="l2" x="452" y="540" text-anchor="middle">room</text>
<text class="l2" x="452" y="566" text-anchor="middle">door</text>
<text class="l2" x="80" y="622">from the elevator</text>
</svg>
