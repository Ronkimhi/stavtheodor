<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Side section of a glazed work lit by an adjustable ceiling spot near the wall: the light covers the work evenly and the reflection in the glass drops to the floor in front of a standing viewer; an inset shows a picture light on a recessed box, and two small controls show the art on its own light while the rest of the space is dimmed</title>
<desc id="d">Side section of a glazed work lit by an adjustable ceiling spot near the wall: the light covers the work evenly and the reflection in the glass drops to the floor in front of a standing viewer; an inset shows a picture light on a recessed box, and two small controls show the art on its own light while the rest of the space is dimmed</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 6 px per in, two side sections, floor at y 880 -->
<!-- main section x 100 to 1000: floor, ceiling 108 in at y 232, wall face at x 1000 -->
<line class="ink" x1="100" y1="880" x2="1000" y2="880"/>
<line class="ink" x1="100" y1="232" x2="1000" y2="232"/>
<line class="ink" x1="1000" y1="232" x2="1000" y2="880"/>
<!-- glazed work in profile, 36 in tall, 1.5 in deep, 40 to 76 in, center 58 in; the glass faces the viewer at x 991 -->
<rect class="frame" x="991" y="424" width="9" height="216"/>
<rect class="art" x="993" y="426" width="5" height="212"/>
<!-- adjustable spot on the ceiling at x 818 (30.3 in from the wall face); beam edges to the glass top and bottom, center ray to 58 in -->
<path class="soft" d="M810 232 L826 232 L823 239 L813 239 Z"/>
<line class="dim" x1="818" y1="232" x2="991" y2="424"/>
<line class="dim" x1="818" y1="232" x2="991" y2="640"/>
<line class="lead" x1="818" y1="232" x2="991" y2="532"/>
<!-- reflection off the glass: the mirror of the center ray (about 30 degrees from vertical), to the floor 33.5 in from the glass -->
<line class="dim" x1="991" y1="532" x2="790" y2="880"/>
<!-- viewer 84 in from the wall, eye at 58.5 in; the reflection reaches the floor between the wall and the viewer -->
<circle class="soft" cx="496" cy="528" r="26"/>
<line class="soft" x1="496" y1="554" x2="496" y2="676"/>
<line class="soft" x1="496" y1="676" x2="468" y2="880"/>
<line class="soft" x1="496" y1="676" x2="524" y2="880"/>
<line class="soft" x1="496" y1="568" x2="456" y2="682"/>
<line class="soft" x1="496" y1="568" x2="536" y2="682"/>
<!-- separate control: two plates with a slider each, the art's knob at the top, the space's near the bottom -->
<rect class="soft" x="140" y="320" width="30" height="45"/>
<line class="soft" x1="155" y1="328" x2="155" y2="357"/>
<circle class="tp" cx="155" cy="332" r="4"/>
<rect class="soft" x="420" y="320" width="30" height="45"/>
<line class="soft" x1="435" y1="328" x2="435" y2="357"/>
<circle class="tp" cx="435" cy="353" r="4"/>
<!-- picture light inset x 1100 to 1520: wall face at x 1400, back face at 1436, the same work, an arm out 8 in at 86 in, a recessed box 85 to 89 in -->
<line class="ink" x1="1100" y1="880" x2="1400" y2="880"/>
<line class="ink" x1="1100" y1="232" x2="1400" y2="232"/>
<line class="ink" x1="1400" y1="232" x2="1400" y2="880"/>
<line class="soft" x1="1436" y1="232" x2="1436" y2="880"/>
<rect class="frame" x="1391" y="424" width="9" height="216"/>
<rect class="art" x="1393" y="426" width="5" height="212"/>
<line class="soft" x1="1400" y1="364" x2="1352" y2="364"/>
<rect class="soft" x="1346" y="364" width="12" height="12"/>
<rect class="lead" x="1400" y="346" width="18" height="24"/>
<!-- labels -->
<text class="l1" x="818" y="200" text-anchor="middle">adjustable spot</text>
<text class="l2" x="840" y="440" text-anchor="end">light falls evenly across the work</text>
<text class="l1" x="120" y="300">separate control</text>
<text class="l2" x="180" y="350">its own light</text>
<text class="l2" x="460" y="350">the rest of the space, dimmed</text>
<text class="l1" x="560" y="934">reflection drops to the floor</text>
<text class="l2" x="979" y="800" text-anchor="end">glazing</text>
<line class="lead" x1="975" y1="780" x2="989" y2="642"/>
<text class="l1" x="1250" y="200" text-anchor="middle">picture light<tspan class="l2"> · recessed box above the art zone</tspan></text>
</svg>
