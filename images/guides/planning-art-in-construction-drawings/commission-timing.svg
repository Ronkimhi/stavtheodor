<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Timeline of the four drawing phases and the installation window, with two commissions of the same length: one started while the building is going up arrives with the finishes, one started at the finishes arrives after the installation window</title>
<desc id="d">Timeline of the four drawing phases and the installation window, with two commissions of the same length: one started while the building is going up arrives with the finishes, one started at the finishes arrives after the installation window</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:44px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- schematic: no physical scale, relative positions only -->
<!-- phase track with ticks at the phase boundaries; segment lengths are order only -->
<line class="dim" x1="150" y1="200" x2="1430" y2="200"/>
<line class="dim" x1="150" y1="192" x2="150" y2="208"/>
<line class="dim" x1="370" y1="192" x2="370" y2="208"/>
<line class="dim" x1="630" y1="192" x2="630" y2="208"/>
<line class="dim" x1="890" y1="192" x2="890" y2="208"/>
<line class="dim" x1="1250" y1="192" x2="1250" y2="208"/>
<line class="dim" x1="1430" y1="192" x2="1430" y2="208"/>
<!-- decision point inside design development -->
<circle class="tp" cx="500" cy="200" r="5"/>
<text class="l2" x="500" y="236" text-anchor="middle">decide the walls</text>
<!-- phase names in two rows above the track; the installation window named below it, at the head of its guides -->
<text class="l1" x="260" y="112" text-anchor="middle">schematic design</text>
<text class="l1" x="500" y="176" text-anchor="middle">design development</text>
<text class="l1" x="760" y="112" text-anchor="middle">construction documents</text>
<text class="l1" x="1070" y="176" text-anchor="middle">construction</text>
<text class="l1" x="1340" y="262" text-anchor="middle">installation window</text>
<text class="l2" x="1340" y="294" text-anchor="middle">after floors, paint and furniture</text>
<line class="lead" x1="1250" y1="306" x2="1250" y2="600"/>
<line class="lead" x1="1430" y1="306" x2="1430" y2="600"/>
<!-- lane 1, the right case: started inside construction, lands before the window opens -->
<line class="dim" x1="930" y1="380" x2="1170" y2="380"/>
<line class="dim" x1="930" y1="372" x2="930" y2="388"/>
<line class="dim" x1="1170" y1="372" x2="1170" y2="388"/>
<rect class="frame" x="1178" y="355" width="64" height="50"/>
<rect class="art" x="1184" y="361" width="52" height="38"/>
<text class="l1" x="930" y="336">commission</text>
<text class="l2" x="150" y="388">started while the building is going up: arrives with the finishes</text>
<!-- lane 2, the late case: the same length, started at the finishes, lands after the window (unchosen outline, no wash) -->
<line class="dim" x1="1190" y1="520" x2="1430" y2="520"/>
<line class="dim" x1="1190" y1="512" x2="1190" y2="528"/>
<line class="dim" x1="1430" y1="512" x2="1430" y2="528"/>
<rect class="lead" x="1438" y="495" width="64" height="50"/>
<text class="l2" x="150" y="528">started at the finishes: arrives after the installation window</text>
</svg>
