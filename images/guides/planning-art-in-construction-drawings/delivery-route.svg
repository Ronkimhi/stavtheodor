<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Plan of the route a large work takes from the street to its wall, through a door, a turn and a stair, with the tightest door or turn circled; beside it the crate drawn around the framed work, larger than it, and three options: a wider opening, a section left open, a work made in parts</title>
<desc id="d">Plan of the route a large work takes from the street to its wall, through a door, a turn and a stair, with the tightest door or turn circled; beside it the crate drawn around the framed work, larger than it, and three options: a wider opening, a section left open, a work made in parts</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:46px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- schematic: no physical scale, relative positions only -->
<!-- street line; the house x 160 to 960, y 160 to 740, front door gap x 240 to 320 in the south wall -->
<line class="soft" x1="80" y1="800" x2="1000" y2="800"/>
<path class="ink" d="M320 740 L960 740 L960 160 L160 160 L160 740 L240 740"/>
<!-- hall north from the door (x 200 to 360), corridor east (y 420 to 540), the space beyond x 700 with a door gap y 440 to 520 -->
<line class="ink" x1="200" y1="420" x2="200" y2="740"/>
<line class="ink" x1="360" y1="540" x2="360" y2="740"/>
<line class="ink" x1="200" y1="420" x2="700" y2="420"/>
<line class="ink" x1="360" y1="540" x2="700" y2="540"/>
<line class="ink" x1="700" y1="160" x2="700" y2="440"/>
<line class="ink" x1="700" y1="520" x2="700" y2="740"/>
<!-- stair in the corridor, seven treads -->
<line class="soft" x1="520" y1="426" x2="520" y2="534"/>
<line class="soft" x1="540" y1="426" x2="540" y2="534"/>
<line class="soft" x1="560" y1="426" x2="560" y2="534"/>
<line class="soft" x1="580" y1="426" x2="580" y2="534"/>
<line class="soft" x1="600" y1="426" x2="600" y2="534"/>
<line class="soft" x1="620" y1="426" x2="620" y2="534"/>
<line class="soft" x1="640" y1="426" x2="640" y2="534"/>
<!-- art wall on the space's north wall -->
<rect class="tp" x="760" y="160" width="140" height="12"/>
<!-- the route, orthogonal, from the street through the door, up the hall, along the corridor over the stair, through the door, to the wall -->
<circle class="tp" cx="280" cy="800" r="5"/>
<path class="dim" d="M280 800 L280 480 L830 480 L830 184"/>
<!-- the tightest door or turn, circled: where the hall meets the corridor (a callout, so a solid .dim line) -->
<circle class="dim" cx="280" cy="480" r="56"/>
<!-- right panel: the framed work with the crate 36 px larger on every side; crate width above, work width below -->
<rect class="soft" x="1144" y="184" width="312" height="252"/>
<rect class="frame" x="1180" y="220" width="240" height="180"/>
<rect class="art" x="1196" y="236" width="208" height="148"/>
<line class="lead" x1="1144" y1="180" x2="1144" y2="156"/>
<line class="lead" x1="1456" y1="180" x2="1456" y2="156"/>
<line class="dim" x1="1144" y1="160" x2="1456" y2="160"/>
<line class="dim" x1="1144" y1="152" x2="1144" y2="168"/>
<line class="dim" x1="1456" y1="152" x2="1456" y2="168"/>
<line class="lead" x1="1180" y1="404" x2="1180" y2="474"/>
<line class="lead" x1="1420" y1="404" x2="1420" y2="474"/>
<line class="dim" x1="1180" y1="470" x2="1420" y2="470"/>
<line class="dim" x1="1180" y1="462" x2="1180" y2="478"/>
<line class="dim" x1="1420" y1="462" x2="1420" y2="478"/>
<!-- labels -->
<text class="l1" x="1300" y="138" text-anchor="middle">crated size</text>
<text class="l1" x="1300" y="528" text-anchor="middle">framed size</text>
<text class="l1" x="340" y="340">the tightest</text>
<text class="l1" x="340" y="396">door or turn</text>
<text class="l2" x="1040" y="566">decide now</text>
<text class="l1" x="1040" y="604">wider opening</text>
<text class="l1" x="1040" y="664">section left open</text>
<text class="l1" x="1040" y="724">work made in parts</text>
<line class="lead" x1="1028" y1="664" x2="334" y2="493"/>
<text class="l2" x="100" y="830">street</text>
<text class="l2" x="330" y="768">door</text>
<text class="l2" x="580" y="600" text-anchor="middle">stair or elevator</text>
<text class="l2" x="818" y="206" text-anchor="end">art wall</text>
</svg>
