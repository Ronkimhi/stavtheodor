<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Back of a frame hung above a bed on two D-rings and two hooks screwed into studs, with bumpers on the lower corners and acrylic glazing marked instead of glass</title>
<desc id="d">Back of a frame hung above a bed on two D-rings and two hooks screwed into studs, with bumpers on the lower corners and acrylic glazing marked instead of glass</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 8 px; frame back, wall elevation and a ledge, no floor line -->
<!-- left: back of a 40 by 26 in frame; D-rings 4 in in from each side, 8 in below the top -->
<rect class="frame" x="120" y="260" width="320" height="208"/>
<rect class="soft" x="136" y="276" width="288" height="176"/>
<rect class="ink" x="142" y="308" width="20" height="14"/>
<circle class="ink" cx="152" cy="330" r="9"/>
<rect class="ink" x="398" y="308" width="20" height="14"/>
<circle class="ink" cx="408" cy="330" r="9"/>
<circle class="ink" cx="140" cy="448" r="7"/>
<circle class="ink" cx="420" cy="448" r="7"/>
<text class="l1" x="462" y="456">bumpers</text>
<text class="l1" x="80" y="620">two D-rings, two hooks</text>
<text class="l2" x="80" y="656">acrylic, not glass</text>
<!-- middle: studs at 16 in centers; hooks on the first and third studs, 32 in apart -->
<line class="lead" x1="700" y1="200" x2="700" y2="540" stroke-width="2"/>
<line class="lead" x1="828" y1="200" x2="828" y2="540" stroke-width="2"/>
<line class="lead" x1="956" y1="200" x2="956" y2="540" stroke-width="2"/>
<line class="lead" x1="1084" y1="200" x2="1084" y2="540" stroke-width="2"/>
<line class="dim" x1="700" y1="224" x2="828" y2="224"/><line class="dim" x1="700" y1="216" x2="700" y2="232"/><line class="dim" x1="828" y1="216" x2="828" y2="232"/>
<text class="l2" x="764" y="212" text-anchor="middle">16 in stud centers</text>
<rect class="soft" x="668" y="296" width="320" height="208"/>
<circle class="tp" cx="700" cy="360" r="6"/>
<path class="ink" d="M700 342 V368 A9 9 0 0 1 686 368"/>
<circle class="tp" cx="956" cy="360" r="6"/>
<path class="ink" d="M956 342 V368 A9 9 0 0 1 942 368"/>
<text class="l1" x="700" y="620">into studs</text>
<text class="l2" x="700" y="656">or anchors rated for twice the weight</text>
<!-- right: a ledge with two leaning frames, struck through -->
<rect class="soft" x="1210" y="450" width="260" height="10"/>
<rect class="soft" x="1210" y="438" width="260" height="12"/>
<g transform="rotate(-7 1270 438)"><rect class="frame" x="1250" y="308" width="100" height="130"/><rect class="art" x="1260" y="318" width="80" height="110"/></g>
<g transform="rotate(-7 1400 438)"><rect class="frame" x="1360" y="342" width="76" height="96"/><rect class="art" x="1370" y="352" width="56" height="76"/></g>
<line class="ink" x1="1190" y1="490" x2="1500" y2="250" stroke-width="3"/>
<text class="l1" x="1520" y="620" text-anchor="end">no ledge above a bed</text>
</svg>
