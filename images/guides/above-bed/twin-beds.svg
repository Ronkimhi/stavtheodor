<rect class="soft" x="1215" y="460" width="190" height="95"/>
<rect class="soft" x="1220" y="555" width="180" height="50"/>
<rect class="soft" x="1225" y="605" width="170" height="35"/>
<line class="soft" x1="1230" y1="640" x2="1230" y2="680"/>
<line class="soft" x1="1390" y1="640" x2="1390" y2="680"/>
<rect class="soft" x="1225" y="480" width="170" height="75" rx="12"/>
<rect class="soft" x="1105" y="550" width="110" height="130"/>
<line class="soft" x1="1105" y1="580" x2="1215" y2="580"/>
<!-- one work 16 by 20 in centered over the nightstand, bottom 52, center 62 (the D44 work on the D44 line) -->
<rect class="frame" x="1120" y="320" width="80" height="100"/>
<rect class="art" x="1130" y="330" width="60" height="80"/>
<line class="dim" x1="1138" y1="370" x2="1182" y2="370" stroke-width="2"/>
<line class="dim" x1="1160" y1="348" x2="1160" y2="392" stroke-width="2"/>
<text class="l1" x="440" y="730" text-anchor="middle">one work per bed</text>
<text class="l1" x="1160" y="730" text-anchor="middle">one work between</text>
</svg>
