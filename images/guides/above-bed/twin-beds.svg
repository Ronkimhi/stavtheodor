<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Two ways to hang art over twin beds: one work centered over each bed, or one work centered over the nightstand between them</title>
<desc id="d">Two ways to hang art over twin beds: one work centered over each bed, or one work centered over the nightstand between them</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; floor at y=680; twins 38 in, headboards 44 in, nightstand 22 in between; works 26 by 20 and 16 by 20 in, bottoms 52 in, centers 62 in -->
<line class="ink" x1="80" y1="680" x2="1520" y2="680"/>
<line class="soft" x1="130" y1="680" x2="130" y2="200"/>
<line class="soft" x1="750" y1="680" x2="750" y2="200"/>
<rect class="soft" x="195" y="460" width="190" height="95"/>
<rect class="soft" x="200" y="555" width="180" height="50"/>
<rect class="soft" x="205" y="605" width="170" height="35"/>
<line class="soft" x1="210" y1="640" x2="210" y2="680"/>
<line class="soft" x1="370" y1="640" x2="370" y2="680"/>
<rect class="soft" x="205" y="480" width="170" height="75" rx="12"/>
<rect class="soft" x="495" y="460" width="190" height="95"/>
<rect class="soft" x="500" y="555" width="180" height="50"/>
<rect class="soft" x="505" y="605" width="170" height="35"/>
<line class="soft" x1="510" y1="640" x2="510" y2="680"/>
<line class="soft" x1="670" y1="640" x2="670" y2="680"/>
<rect class="soft" x="505" y="480" width="170" height="75" rx="12"/>
<rect class="soft" x="385" y="550" width="110" height="130"/>
<line class="soft" x1="385" y1="580" x2="495" y2="580"/>
<!-- one work 26 by 20 in over each bed, bottom 52, center 62 -->
<rect class="frame" x="225" y="320" width="130" height="100"/>
<rect class="art" x="235" y="330" width="110" height="80"/>
<line class="dim" x1="268" y1="370" x2="312" y2="370" stroke-width="2"/>
<line class="dim" x1="290" y1="348" x2="290" y2="392" stroke-width="2"/>
<line class="dim" x1="225" y1="304" x2="355" y2="304"/>
<line class="dim" x1="225" y1="296" x2="225" y2="312"/>
<line class="dim" x1="355" y1="296" x2="355" y2="312"/>
<rect class="frame" x="525" y="320" width="130" height="100"/>
<rect class="art" x="535" y="330" width="110" height="80"/>
<line class="dim" x1="568" y1="370" x2="612" y2="370" stroke-width="2"/>
<line class="dim" x1="590" y1="348" x2="590" y2="392" stroke-width="2"/>
<line class="dim" x1="525" y1="304" x2="655" y2="304"/>
<line class="dim" x1="525" y1="296" x2="525" y2="312"/>
<line class="dim" x1="655" y1="296" x2="655" y2="312"/>
<text class="l2" x="440" y="290" text-anchor="middle">sized to each bed</text>
<line class="soft" x1="850" y1="680" x2="850" y2="200"/>
<line class="soft" x1="1470" y1="680" x2="1470" y2="200"/>
<rect class="soft" x="915" y="460" width="190" height="95"/>
<rect class="soft" x="920" y="555" width="180" height="50"/>
<rect class="soft" x="925" y="605" width="170" height="35"/>
