<rect class="soft" x="1064" y="416" width="456" height="114"/><rect class="soft" x="1070" y="530" width="444" height="60"/><rect class="soft" x="1076" y="590" width="432" height="42"/><line class="soft" x1="1082" y1="632" x2="1082" y2="680"/><line class="soft" x1="1502" y1="632" x2="1502" y2="680"/><rect class="soft" x="1082" y="440" width="204" height="90" rx="12"/><rect class="soft" x="1298" y="440" width="204" height="90" rx="12"/>
<rect class="frame" x="1142" y="182" width="300" height="180"/><rect class="art" x="1154" y="194" width="276" height="156"/>
<line class="dim" x1="1270" y1="272" x2="1314" y2="272" stroke-width="2"/><line class="dim" x1="1292" y1="250" x2="1292" y2="294" stroke-width="2"/>
<line class="dim" x1="1142" y1="142" x2="1442" y2="142"/><line class="dim" x1="1142" y1="134" x2="1142" y2="150"/><line class="dim" x1="1442" y1="134" x2="1442" y2="150"/>
<text class="l1" x="1292" y="130" text-anchor="middle">50 in<tspan class="l2"> · 127 cm</tspan></text>
