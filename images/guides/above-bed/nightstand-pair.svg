<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Two views of a bed with a work above each nightstand: correctly centered on each nightstand, and wrongly pushed off center</title>
<desc id="d">Two views of a bed with a work above each nightstand: correctly centered on each nightstand, and wrongly pushed off center</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; floor at y=680; queen 60 in, headboard 44 in; nightstands 22 by 26 in, 2 in from the bed; works 16 by 20 in, bottoms 52 in -->
<line class="ink" x1="80" y1="680" x2="1520" y2="680"/>
<line class="soft" x1="130" y1="680" x2="130" y2="200"/>
<line class="soft" x1="750" y1="680" x2="750" y2="200"/>
<rect class="soft" x="290" y="460" width="300" height="95"/>
<rect class="soft" x="295" y="555" width="290" height="50"/>
<rect class="soft" x="300" y="605" width="280" height="35"/>
<line class="soft" x1="305" y1="640" x2="305" y2="680"/>
<line class="soft" x1="575" y1="640" x2="575" y2="680"/>
<rect class="soft" x="300" y="480" width="135" height="75" rx="12"/>
<rect class="soft" x="445" y="480" width="135" height="75" rx="12"/>
<rect class="soft" x="170" y="550" width="110" height="130"/>
<line class="soft" x1="170" y1="580" x2="280" y2="580"/>
<rect class="soft" x="600" y="550" width="110" height="130"/>
<line class="soft" x1="600" y1="580" x2="710" y2="580"/>
<!-- right way: each work centered on its nightstand (43 in either side of the bed's center), centers level at 62 in -->
<rect class="frame" x="185" y="320" width="80" height="100"/>
<rect class="art" x="195" y="330" width="60" height="80"/>
<line class="dim" x1="203" y1="370" x2="247" y2="370" stroke-width="2"/>
<line class="dim" x1="225" y1="348" x2="225" y2="392" stroke-width="2"/>
<rect class="frame" x="615" y="320" width="80" height="100"/>
<rect class="art" x="625" y="330" width="60" height="80"/>
<line class="dim" x1="633" y1="370" x2="677" y2="370" stroke-width="2"/>
<line class="dim" x1="655" y1="348" x2="655" y2="392" stroke-width="2"/>
<line class="dim" x1="275" y1="370" x2="605" y2="370"/>
<text class="l2" x="440" y="358" text-anchor="middle">centers level</text>
<line class="soft" x1="850" y1="680" x2="850" y2="200"/>
<line class="soft" x1="1470" y1="680" x2="1470" y2="200"/>
<rect class="soft" x="1010" y="460" width="300" height="95"/>
<rect class="soft" x="1015" y="555" width="290" height="50"/>
<rect class="soft" x="1020" y="605" width="280" height="35"/>
<line class="soft" x1="1025" y1="640" x2="1025" y2="680"/>
<line class="soft" x1="1295" y1="640" x2="1295" y2="680"/>
<rect class="soft" x="1020" y="480" width="135" height="75" rx="12"/>
<rect class="soft" x="1165" y="480" width="135" height="75" rx="12"/>
<rect class="soft" x="890" y="550" width="110" height="130"/>
<line class="soft" x1="890" y1="580" x2="1000" y2="580"/>
<rect class="soft" x="1320" y="550" width="110" height="130"/>
<line class="soft" x1="1320" y1="580" x2="1430" y2="580"/>
<!-- wrong way: the pair pushed 10 in outward, off the nightstand centers -->
<rect class="lead" x="855" y="320" width="80" height="100"/>
<line class="dim" x1="873" y1="370" x2="917" y2="370" stroke-width="2"/>
<line class="dim" x1="895" y1="348" x2="895" y2="392" stroke-width="2"/>
<rect class="lead" x="1385" y="320" width="80" height="100"/>
<line class="dim" x1="1403" y1="370" x2="1447" y2="370" stroke-width="2"/>
<line class="dim" x1="1425" y1="348" x2="1425" y2="392" stroke-width="2"/>
<text class="l1" x="440" y="730" text-anchor="middle">centered on each nightstand</text>
<text class="l1" x="1160" y="730" text-anchor="middle">off center</text>
</svg>
