<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Bedroom floor plan: the wall above the bed, seen when you walk in, and the wall facing the bed, seen from the pillow, each marked with its viewing line</title>
<desc id="d">Bedroom floor plan: the wall above the bed, seen when you walk in, and the wall facing the bed, seen from the pillow, each marked with its viewing line</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; plan, north wall at the top, room 168 by 144 in -->
<polyline class="ink" points="1010,860 380,860 380,140 1220,140 1220,860 1190,860"/>
<rect class="soft" x="1214" y="340" width="12" height="300"/>
<line class="soft" x1="1190" y1="860" x2="1190" y2="680"/>
<path class="soft" d="M1010 860 A180 180 0 0 1 1190 680"/>
<rect class="soft" x="650" y="140" width="300" height="15"/>
<rect class="soft" x="650" y="155" width="300" height="385"/>
<rect class="soft" x="665" y="170" width="130" height="70" rx="10"/>
<rect class="soft" x="805" y="170" width="130" height="70" rx="10"/>
<line class="soft" x1="650" y1="290" x2="950" y2="290"/>
<rect class="soft" x="540" y="140" width="110" height="90"/>
<rect class="soft" x="950" y="140" width="110" height="90"/>
<rect class="soft" x="650" y="760" width="300" height="100"/>
<text class="l2" x="880" y="820" text-anchor="middle">dresser</text>
<rect class="tp" x="680" y="134" width="240" height="12"/>
<rect class="tp" x="680" y="854" width="240" height="12"/>
<line class="eye" x1="1100" y1="860" x2="800" y2="140"/>
<line class="eye" x1="800" y1="200" x2="800" y2="860"/>
<circle class="tp" cx="1100" cy="860" r="6"/>
<circle class="tp" cx="800" cy="200" r="6"/>
<text class="l1" x="800" y="112" text-anchor="middle">wall above the bed</text>
<text class="l2" x="800" y="80" text-anchor="middle">seen from the door</text>
<text class="l1" x="800" y="912" text-anchor="middle">wall facing the bed</text>
<text class="l2" x="800" y="944" text-anchor="middle">seen from the pillow</text>
<text class="l2" x="1100" y="912" text-anchor="middle">door</text>
</svg>
