<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Four small elevations showing picture heights: 8 to 10 inches above a sofa back, 6 to 10 inches above a console, 6 to 10 inches above a mantel, and a center line 57 to 60 inches above each stair tread</title>
<desc id="d">Four small elevations showing picture heights: 8 to 10 inches above a sofa back, 6 to 10 inches above a console, 6 to 10 inches above a mantel, and a center line 57 to 60 inches above each stair tread</desc>
<style>
