<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Two walls, one with an 8 foot and one with a 12 foot ceiling: both works center at 57 to 60 inches, and the tall wall takes a larger work instead of a higher one</title>
<desc id="d">Two walls, one with an 8 foot and one with a 12 foot ceiling: both works center at 57 to 60 inches, and the tall wall takes a larger work instead of a higher one</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5.5 px; floor at y=880; ceilings at 96 in (y=352) and 144 in (y=88) -->
<line class="ink" x1="80" y1="880" x2="1520" y2="880"/>
<line class="ink" x1="80" y1="352" x2="800" y2="352"/>
<line class="ink" x1="800" y1="352" x2="800" y2="88"/>
<line class="ink" x1="800" y1="88" x2="1520" y2="88"/>
<line class="eye" x1="80" y1="566.5" x2="1520" y2="566.5"/>
<line class="eye" x1="80" y1="550" x2="1520" y2="550"/>
<!-- left: 40 by 30 in, center 58; right: 48 by 72 in, bottom 22, top 94, center 58; ghost 40 by 30 lifted to a center of 80 in -->
<circle class="soft" cx="200" cy="559.5" r="26"/>
<line class="soft" x1="200" y1="585.5" x2="200" y2="693"/>
<line class="soft" x1="200" y1="693" x2="172" y2="880"/>
<line class="soft" x1="200" y1="693" x2="228" y2="880"/>
<line class="soft" x1="200" y1="594" x2="160" y2="698.5"/>
<line class="soft" x1="200" y1="594" x2="240" y2="698.5"/>
<circle class="tp" cx="220" cy="558.2" r="3"/>
<circle class="soft" cx="900" cy="559.5" r="26"/>
<line class="soft" x1="900" y1="585.5" x2="900" y2="693"/>
<line class="soft" x1="900" y1="693" x2="872" y2="880"/>
<line class="soft" x1="900" y1="693" x2="928" y2="880"/>
<line class="soft" x1="900" y1="594" x2="860" y2="698.5"/>
<line class="soft" x1="900" y1="594" x2="940" y2="698.5"/>
<circle class="tp" cx="920" cy="558.2" r="3"/>
<rect class="frame" x="390" y="478.5" width="220" height="165"/>
<rect class="art" x="406" y="494.5" width="188" height="133"/>
<line class="dim" x1="478" y1="561" x2="522" y2="561" stroke-width="2"/>
<line class="dim" x1="500" y1="539" x2="500" y2="583" stroke-width="2"/>
<rect class="frame" x="998" y="363" width="264" height="396"/>
<rect class="art" x="1014" y="379" width="232" height="364"/>
<line class="dim" x1="1108" y1="561" x2="1152" y2="561" stroke-width="2"/>
<line class="dim" x1="1130" y1="539" x2="1130" y2="583" stroke-width="2"/>
<rect class="lead" x="1285" y="357.5" width="220" height="165"/>
<line class="dim" x1="1373" y1="440" x2="1417" y2="440" stroke-width="2"/>
<line class="dim" x1="1395" y1="418" x2="1395" y2="462" stroke-width="2"/>
<text class="l1" x="420" y="338" text-anchor="middle">8 ft ceiling<tspan class="l2"> · 244 cm</tspan></text>
<text class="l1" x="1160" y="74" text-anchor="middle">12 ft ceiling<tspan class="l2"> · 366 cm</tspan></text>
<text class="l1" x="1180" y="930" text-anchor="middle">larger, not higher</text>
<text class="l2" x="1395" y="343.5" text-anchor="middle">not lifted</text>
<text class="l2" x="1520" y="596.5" text-anchor="end">57 to 60 in</text>
<text class="l2" x="1520" y="624.5" text-anchor="end">145 to 152 cm</text>
</svg>
