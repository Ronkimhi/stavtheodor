<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Side section of a wall and ceiling showing a spotlight aimed at the center of a framed work at an angle of 30 degrees from vertical, with the reflection falling toward the floor instead of into the viewer's eyes</title>
<desc id="d">Side section of a wall and ceiling showing a spotlight aimed at the center of a framed work at an angle of 30 degrees from vertical, with the reflection falling toward the floor instead of into the viewer's eyes</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 7 px; floor at y=780; ceiling at 96 in (y=108); wall at x=1400 -->
<line class="ink" x1="80" y1="780" x2="1400" y2="780"/>
<line class="ink" x1="80" y1="108" x2="1400" y2="108"/>
<line class="ink" x1="1400" y1="108" x2="1400" y2="780"/>
<!-- the 40 by 30 in work in profile, center 58 in, top 73 in; recessed spot 22 in out from the wall -->
<rect class="soft" x="1232" y="94" width="28" height="14"/>
<line class="ink" x1="1236" y1="108" x2="1256" y2="108" stroke-width="4"/>
<line class="dim" x1="1246" y1="108" x2="1394" y2="374"/>
<line class="lead" x1="1246" y1="108" x2="1246" y2="238"/>
<path class="dim" d="M1246 208 A100 100 0 0 0 1296.1 194.5"/>
<text class="l1" x="1232" y="180" text-anchor="end">30°</text>
<text class="l2" x="1232" y="210" text-anchor="end">from vertical</text>
<!-- reflections: center ray at 30°, top-edge ray at 43.7° (22 in out, 23 in down), its incident ray dotted -->
<line class="dim" x1="1394" y1="374" x2="1159.6" y2="780"/>
<line class="lead" x1="1246" y1="108" x2="1400" y2="269"/>
<line class="dim" x1="1400" y1="269" x2="911.2" y2="780"/>
<rect class="frame" x="1388" y="269" width="12" height="210"/>
<rect class="art" x="1391" y="275" width="6" height="198"/>
<line class="dim" x1="1372" y1="374" x2="1416" y2="374" stroke-width="2"/>
<line class="dim" x1="1394" y1="352" x2="1394" y2="396" stroke-width="2"/>
<circle class="soft" cx="812" cy="365" r="26"/>
<line class="soft" x1="812" y1="391" x2="812" y2="542"/>
<line class="soft" x1="812" y1="542" x2="784" y2="780"/>
<line class="soft" x1="812" y1="542" x2="840" y2="780"/>
<line class="soft" x1="812" y1="416" x2="772" y2="549"/>
<line class="soft" x1="812" y1="416" x2="852" y2="549"/>
<circle class="tp" cx="832" cy="370.5" r="3"/>
<line class="eye" x1="838" y1="370.5" x2="1388" y2="374"/>
<text class="l1" x="1232.3" y="822" text-anchor="middle">reflection falls to the floor</text>
<text class="l2" x="1216" y="140" text-anchor="end">spot about 22 in (56 cm) from the wall on an 8 ft ceiling</text>
</svg>
