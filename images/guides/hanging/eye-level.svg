<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Elevation drawing of a standing adult facing a framed picture whose center is marked 57 to 60 inches, 145 to 152 centimeters, from the floor, on the same line as the viewer's eyes</title>
<desc id="d">Elevation drawing of a standing adult facing a framed picture whose center is marked 57 to 60 inches, 145 to 152 centimeters, from the floor, on the same line as the viewer's eyes</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 8 px; floor at y=780 -->
<line class="ink" x1="80" y1="780" x2="1520" y2="780"/>
<!-- the work: 40 by 30 in, center at 58.5 in; the figure 63 in tall, eye at 58.5 in, 84 in from the work -->
<line class="eye" x1="80" y1="324" x2="1172" y2="324"/>
<line class="eye" x1="80" y1="300" x2="1172" y2="300"/>
<rect class="frame" x="460" y="192" width="320" height="240"/>
<rect class="art" x="476" y="208" width="288" height="208"/>
<line class="dim" x1="598" y1="312" x2="642" y2="312" stroke-width="2"/>
<line class="dim" x1="620" y1="290" x2="620" y2="334" stroke-width="2"/>
<circle class="soft" cx="1292" cy="302" r="26"/>
<line class="soft" x1="1292" y1="328" x2="1292" y2="508"/>
<line class="soft" x1="1292" y1="508" x2="1264" y2="780"/>
<line class="soft" x1="1292" y1="508" x2="1320" y2="780"/>
<line class="soft" x1="1292" y1="364" x2="1252" y2="516"/>
<line class="soft" x1="1292" y1="364" x2="1332" y2="516"/>
<circle class="tp" cx="1272" cy="312" r="3"/>
<line class="eye" x1="1266" y1="312" x2="646" y2="312"/>
<line class="dim" x1="420" y1="312" x2="420" y2="780"/>
<line class="dim" x1="412" y1="312" x2="428" y2="312"/>
<line class="dim" x1="412" y1="780" x2="428" y2="780"/>
<text class="l1" x="434" y="660">57 to 60 in<tspan class="l2"> · 145 to 152 cm</tspan></text>
<text class="l1" x="700" y="516" text-anchor="middle">center of the work,</text>
<text class="l1" x="700" y="580" text-anchor="middle">not the top</text>
</svg>
