<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Floor plan of a home with a sightline from the front door to the wall facing it: one original work on that first wall, three trade prints along the corridor, and a commissioned work across the widest wall of the living space</title>
<desc id="d">Floor plan of a home with a sightline from the front door to the wall facing it: one original work on that first wall, three trade prints along the corridor, and a commissioned work across the widest wall of the living space</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1.7 px per in, plan -->
<!-- outer walls 600 by 360 in; plan origin at px (80, 144); the reader stands in the front door (south wall) -->
<line class="ink" x1="80" y1="144" x2="1100" y2="144"/>
<line class="ink" x1="1100" y1="144" x2="1100" y2="756"/>
<line class="ink" x1="80" y1="144" x2="80" y2="756"/>
<line class="ink" x1="80" y1="756" x2="933.4" y2="756"/>
<line class="ink" x1="994.6" y1="756" x2="1100" y2="756"/>
<!-- front door: 36 in leaf hinged at x 502, 90 degree swing inward (inference: a standard exterior door) -->
<line class="soft" x1="933.4" y1="756" x2="933.4" y2="694.8"/>
<path class="soft" d="M933.4 694.8 A61.2 61.2 0 0 1 994.6 756"/>
<!-- foyer x 440 to 600, y 200 to 360; north wall to x 558; west wall with a 90 in opening y 230 to 320 -->
<line class="ink" x1="828" y1="484" x2="1028.6" y2="484"/>
<line class="ink" x1="828" y1="484" x2="828" y2="535"/>
<line class="ink" x1="828" y1="688" x2="828" y2="756"/>
<!-- corridor x 558 to 600, 42 in wide (inference); west wall with one 32 in door gap y 80 to 112 -->
<line class="ink" x1="1028.6" y1="144" x2="1028.6" y2="280"/>
<line class="ink" x1="1028.6" y1="334.4" x2="1028.6" y2="484"/>
<!-- bedroom block x 440 to 558, y 0 to 200 -->
<line class="ink" x1="828" y1="144" x2="828" y2="484"/>
<!-- living space x 0 to 440, open; sofa 84 by 36 in, back to the south, facing the north wall -->
<rect class="soft" x="382.6" y="331" width="142.8" height="61.2"/>
<line class="soft" x1="382.6" y1="382" x2="525.4" y2="382"/>
<line class="soft" x1="392.8" y1="331" x2="392.8" y2="382"/>
<line class="soft" x1="515.2" y1="331" x2="515.2" y2="382"/>
<!-- sightline: from the door's center straight north to the center of the original -->
<circle class="tp" cx="964" cy="756" r="3"/>
<line class="eye" x1="964" y1="756" x2="964" y2="484"/>
<!-- the works: 12 px deep on the inner face of their walls, frame with the art wash (inset 3 px at this depth) -->
<rect class="frame" x="923.2" y="484" width="81.6" height="12"/>
<rect class="art" x="926.2" y="487" width="75.6" height="6"/>
<rect class="frame" x="1088" y="213.7" width="12" height="30.6"/>
<rect class="art" x="1091" y="216.7" width="6" height="24.6"/>
<rect class="frame" x="1088" y="298.7" width="12" height="30.6"/>
<rect class="art" x="1091" y="301.7" width="6" height="24.6"/>
<rect class="frame" x="1088" y="383.7" width="12" height="30.6"/>
<rect class="art" x="1091" y="386.7" width="6" height="24.6"/>
<rect class="frame" x="341.8" y="144" width="224.4" height="12"/>
<rect class="art" x="344.8" y="147" width="218.4" height="6"/>
<!-- labels: Original and Trade prints in the right column with leaders; Commission inside the living space -->
<text class="l1" x="1160" y="499">Original<tspan class="l2"> · where the eye lands first</tspan></text>
<line class="lead" x1="1148" y1="490" x2="1008.8" y2="490"/>
<text class="l1" x="1160" y="323">Trade prints<tspan class="l2"> · the walls people pass</tspan></text>
<line class="lead" x1="1148" y1="314" x2="1104" y2="314"/>
<text class="l1" x="454" y="210" text-anchor="middle">Commission<tspan class="l2"> · a wall nothing on the market fits</tspan></text>
<text class="l2" x="964" y="790" text-anchor="middle">entry</text>
<text class="l2" x="1160" y="359">corridor</text>
<text class="l2" x="100.4" y="742.4">living space</text>
</svg>
