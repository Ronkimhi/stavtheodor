<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Side section of a waiting area: on the wall behind the seated patient, a work hung 8 to 12 inches above the chair backs, within reach of heads leaning back; on the wall the patient faces, a work centered below the 57 to 60 inch standing line</title>
<desc id="d">Side section of a waiting area: on the wall behind the seated patient, a work hung 8 to 12 inches above the chair backs, within reach of heads leaning back; on the wall the patient faces, a work centered below the 57 to 60 inch standing line</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 8 px; side section, floor at y=780, room 120 in deep, walls at x 250 and x 1210 -->
<!-- floor and the two walls to 84 in; no ceiling -->
<line class="ink" x1="80" y1="780" x2="1520" y2="780"/>
<line class="ink" x1="250" y1="780" x2="250" y2="108"/>
<line class="ink" x1="1210" y1="780" x2="1210" y2="108"/>
<!-- chair against the right wall: back 2 in thick to 33 in, seat top 18 in, 20 in deep, legs at x 1058 and 1202 -->
<rect class="soft" x="1194" y="516" width="16" height="120"/>
<rect class="soft" x="1050" y="636" width="160" height="16"/>
<line class="soft" x1="1058" y1="652" x2="1058" y2="780"/>
<line class="soft" x1="1202" y1="652" x2="1202" y2="780"/>
<!-- seated figure, faceless: head r 26 at (1172, 390) touching the frame face (x 1198), eye dot at 47 in, five strokes; drawn, never labelled (Curator check 2026-09-30) -->
<circle class="soft" cx="1172" cy="390" r="26"/>
<line class="soft" x1="1170" y1="416" x2="1162" y2="636"/>
<line class="soft" x1="1162" y1="636" x2="1066" y2="628"/>
<line class="soft" x1="1066" y1="628" x2="1070" y2="780"/>
<line class="soft" x1="1168" y1="470" x2="1120" y2="560"/>
<line class="soft" x1="1120" y1="560" x2="1092" y2="612"/>
<!-- work behind their heads: profile 1.5 in deep, bottom 43 in, top 67 in, center 55 in; the head reaches its lower edge -->
<rect class="frame" x="1198" y="244" width="12" height="192"/>
<rect class="art" x="1199" y="245" width="10" height="190"/>
<line class="dim" x1="1182" y1="340" x2="1226" y2="340" stroke-width="2"/>
<line class="dim" x1="1204" y1="318" x2="1204" y2="362" stroke-width="2"/>
<!-- the gap above the chair back: 33 to 43 in, drawn 10 in, with leaders from the back top and the frame bottom -->
<line class="lead" x1="1210" y1="516" x2="1222" y2="516"/>
<line class="lead" x1="1210" y1="436" x2="1222" y2="436"/>
<line class="dim" x1="1230" y1="436" x2="1230" y2="516"/>
<line class="dim" x1="1222" y1="436" x2="1238" y2="436"/>
<line class="dim" x1="1222" y1="516" x2="1238" y2="516"/>
<!-- work on the wall they face: profile 1.5 in deep, bottom 39 in, top 69 in, center 54 in (a drawing position for lower, not a rule) -->
<rect class="frame" x="250" y="228" width="12" height="240"/>
<rect class="art" x="251" y="229" width="10" height="238"/>
<line class="dim" x1="234" y1="348" x2="278" y2="348" stroke-width="2"/>
<line class="dim" x1="256" y1="326" x2="256" y2="370" stroke-width="2"/>
<!-- sightline from the seated eye to the facing work's center; standing band at 57 and 60 in between the two works -->
<line class="eye" x1="1154" y1="404" x2="262" y2="348"/>
<circle class="tp" cx="1154" cy="404" r="3"/>
<line class="eye" x1="262" y1="324" x2="1198" y2="324"/>
<line class="eye" x1="262" y1="300" x2="1198" y2="300"/>
<!-- labels; band label baseline 274 so the compact descender clears the 60 in line by 12 px (Curator check 2026-09-30); right labels at x 1250, 12 px off the lower tick's end -->
<text class="l1" x="1250" y="484">8 to 12 in</text>
<text class="l2" x="1250" y="516">20 to 30 cm</text>
<text class="l2" x="1250" y="548">heads reach it: acrylic</text>
<text class="l1" x="730" y="274" text-anchor="middle">57 to 60 in, standing<tspan class="l2"> · 145 to 152 cm</tspan></text>
<text class="l1" x="274" y="150">The wall they face</text>
<text class="l2" x="274" y="182">center below the standing line</text>
<text class="l2" x="274" y="210">set with the chairs in place</text>
<text class="l1" x="1198" y="150" text-anchor="end">Behind their heads</text>
<text class="l2" x="1198" y="182" text-anchor="end">the chair backs set the height</text>
</svg>
