<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Side view of one work seen by two people: close to the wall it fills a wide angle of view, from the doorway the same work fills a much narrower one</title>
<desc id="d">Side view of one work seen by two people: close to the wall it fills a wide angle of view, from the doorway the same work fills a much narrower one</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; floor at y=680; wall at x=1440; work 30 in tall, center 58; viewers 24 and 180 in from the wall -->
<line class="ink" x1="80" y1="680" x2="1440" y2="680"/>
<line class="ink" x1="1440" y1="680" x2="1440" y2="200"/>
<!-- doorway: jamb and header, the far viewer standing in it -->
<line class="ink" x1="486" y1="680" x2="486" y2="260"/>
<line class="ink" x1="486" y1="260" x2="420" y2="260"/>
<line class="soft" x1="420" y1="260" x2="420" y2="680"/>
<!-- angles of view, shaded faintly -->
<path class="art" fill-opacity=".1" d="M560 387.5 L1428 315 L1428 465 Z"/>
<path class="art" fill-opacity=".1" d="M1340 387.5 L1428 315 L1428 465 Z"/>
<line class="dim" x1="560" y1="387.5" x2="1428" y2="315"/>
<line class="dim" x1="560" y1="387.5" x2="1428" y2="465"/>
<line class="dim" x1="1340" y1="387.5" x2="1428" y2="315"/>
<line class="dim" x1="1340" y1="387.5" x2="1428" y2="465"/>
<rect class="frame" x="1428" y="315" width="12" height="150"/>
<rect class="art" x="1431" y="321" width="6" height="138"/>
<line class="dim" x1="1412" y1="390" x2="1456" y2="390" stroke-width="2"/>
<line class="dim" x1="1434" y1="368" x2="1434" y2="412" stroke-width="2"/>
<circle class="soft" cx="1320" cy="391" r="26"/>
<line class="soft" x1="1320" y1="417" x2="1320" y2="510"/>
<line class="soft" x1="1320" y1="510" x2="1292" y2="680"/>
<line class="soft" x1="1320" y1="510" x2="1348" y2="680"/>
<line class="soft" x1="1320" y1="420" x2="1280" y2="515"/>
<line class="soft" x1="1320" y1="420" x2="1360" y2="515"/>
<circle class="tp" cx="1340" cy="387.5" r="3"/>
<circle class="soft" cx="540" cy="391" r="26"/>
<line class="soft" x1="540" y1="417" x2="540" y2="510"/>
<line class="soft" x1="540" y1="510" x2="512" y2="680"/>
<line class="soft" x1="540" y1="510" x2="568" y2="680"/>
<line class="soft" x1="540" y1="420" x2="500" y2="515"/>
<line class="soft" x1="540" y1="420" x2="580" y2="515"/>
<circle class="tp" cx="560" cy="387.5" r="3"/>
<text class="l1" x="1320" y="730" text-anchor="middle">close to the wall</text>
<text class="l1" x="540" y="730" text-anchor="middle">from the doorway</text>
<text class="l2" x="1420" y="299" text-anchor="end">the same work</text>
</svg>
