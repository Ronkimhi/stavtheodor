<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Floor plan of a living room with sightlines from the doorway and from the sofa, both meeting on one wall, marked as the main wall</title>
<desc id="d">Floor plan of a living room with sightlines from the doorway and from the sofa, both meeting on one wall, marked as the main wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; plan, north wall at the top, room 192 by 156 in -->
<polyline class="ink" points="1040,920 320,920 320,140 1280,140 1280,920 1220,920"/>
<rect class="soft" x="314" y="290" width="12" height="360"/>
<text class="l2" x="298" y="478" text-anchor="end">window</text>
<line class="soft" x1="1040" y1="920" x2="1040" y2="740"/>
<path class="soft" d="M1040 740 A180 180 0 0 1 1220 920"/>
<text class="l2" x="1130" y="960" text-anchor="middle">door</text>
<rect class="soft" x="470" y="730" width="420" height="190"/>
<rect class="soft" x="470" y="880" width="420" height="40"/>
<rect class="soft" x="470" y="730" width="30" height="150"/>
<rect class="soft" x="860" y="730" width="30" height="150"/>
<text class="l2" x="680" y="840" text-anchor="middle">sofa</text>
<rect class="soft" x="380" y="310" width="160" height="160" rx="6"/>
<rect class="soft" x="380" y="310" width="30" height="160" rx="4"/>
<rect class="soft" x="380" y="510" width="160" height="160" rx="6"/>
<rect class="soft" x="380" y="510" width="30" height="160" rx="4"/>
<rect class="tp" x="620" y="134" width="300" height="12"/>
<line class="eye" x1="1130" y1="920" x2="770" y2="140"/>
<line class="eye" x1="680" y1="730" x2="770" y2="140"/>
<circle class="tp" cx="1130" cy="920" r="6"/>
<circle class="tp" cx="680" cy="730" r="6"/>
<text class="l2" x="988" y="640" text-anchor="end">from the door</text>
<text class="l2" x="700" y="715">from the sofa</text>
<text class="l1" x="770" y="112" text-anchor="middle">main wall</text>
</svg>
