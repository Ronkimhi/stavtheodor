<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Four living room walls unfolded: a painting on the main wall, a pair of works on paper on a second wall, a sculpture and small work on a console on the third, and a fourth wall left quiet</title>
<desc id="d">Four living room walls unfolded: a painting on the main wall, a pair of works on paper on a second wall, a sculpture and small work on a console on the third, and a fourth wall left quiet</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 2.5 px; floor at y=580; four 144 in walls unfolded, 360 px each; ceiling 96 in -->
<line class="ink" x1="80" y1="580" x2="1520" y2="580"/>
<line class="soft" x1="80" y1="580" x2="80" y2="340"/>
<line class="soft" x1="440" y1="580" x2="440" y2="340"/>
<line class="soft" x1="800" y1="580" x2="800" y2="340"/>
<line class="soft" x1="1160" y1="580" x2="1160" y2="340"/>
<line class="soft" x1="1520" y1="580" x2="1520" y2="340"/>
<line class="eye" x1="80" y1="437.5" x2="1520" y2="437.5"/>
<line class="eye" x1="80" y1="430" x2="1520" y2="430"/>
<!-- main wall: 84 in sofa, back 32; painting 56 by 38 in (two thirds of the sofa), bottom 41, center 60, drawn with a deep edge -->
<rect class="soft" x="175" y="500" width="210" height="40"/>
<rect class="soft" x="175" y="540" width="210" height="15"/>
<rect class="soft" x="175" y="515" width="15" height="25"/>
<rect class="soft" x="370" y="515" width="15" height="25"/>
<line class="soft" x1="185" y1="555" x2="185" y2="580"/>
<line class="soft" x1="375" y1="555" x2="375" y2="580"/>
<line class="ink" x1="355" y1="387.5" x2="355" y2="482.5"/>
<line class="ink" x1="215" y1="482.5" x2="355" y2="482.5"/>
<rect class="frame" x="210" y="382.5" width="140" height="95"/>
<rect class="art" x="218" y="390.5" width="124" height="79"/>
<line class="dim" x1="258" y1="430" x2="302" y2="430" stroke-width="2"/>
<line class="dim" x1="280" y1="408" x2="280" y2="452" stroke-width="2"/>
<!-- supporting wall: pair 20 by 28 in, 3.5 in apart, wide mats, group center 58 -->
<rect class="frame" x="565.6" y="400" width="50" height="70"/>
<rect class="soft" x="573.1" y="407.5" width="35" height="55"/>
<rect class="art" x="573.1" y="407.5" width="35" height="55"/>
<rect class="frame" x="624.4" y="400" width="50" height="70"/>
<rect class="soft" x="631.9" y="407.5" width="35" height="55"/>
<rect class="art" x="631.9" y="407.5" width="35" height="55"/>
<line class="dim" x1="598" y1="435" x2="642" y2="435" stroke-width="2"/>
<line class="dim" x1="620" y1="413" x2="620" y2="457" stroke-width="2"/>
<!-- third wall: console 48 by 34, sculpture 8 by 14 in flush with its left end, work 24 by 30 in centered 8 in above it, center 57 -->
<rect class="soft" x="920" y="495" width="120" height="85"/>
<line class="soft" x1="920" y1="500" x2="1040" y2="500"/>
<rect class="soft" x="920" y="460" width="20" height="35"/>
<rect class="frame" x="950" y="400" width="60" height="75"/>
<rect class="art" x="956" y="406" width="48" height="63"/>
<line class="dim" x1="958" y1="437.5" x2="1002" y2="437.5" stroke-width="2"/>
<line class="dim" x1="980" y1="415.5" x2="980" y2="459.5" stroke-width="2"/>
<!-- quiet wall: nothing, a dotted rectangle -->
<rect class="lead" x="1280" y="390" width="120" height="90"/>
<!-- band pair lifted to the right of the quiet wall, a lead down to the 60 in line -->
<text class="l2" x="1508" y="338" text-anchor="end">57 to 60 in</text>
<text class="l2" x="1508" y="366" text-anchor="end">145 to 152 cm</text>
<line class="lead" x1="1460" y1="372" x2="1460" y2="430"/>
<text class="l1" x="280" y="630" text-anchor="middle">painting</text>
<text class="l1" x="620" y="630" text-anchor="middle">works on paper</text>
<text class="l1" x="980" y="686" text-anchor="middle">sculpture and a small work</text>
<text class="l1" x="1340" y="630" text-anchor="middle">quiet</text>
</svg>
