<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Plan of a living space with a wall of windows: the main work hangs on the wall seen first from the entrance, not squeezed between the windows</title>
<desc id="d">Plan of a living space with a wall of windows: the main work hangs on the wall seen first from the entrance, not squeezed between the windows</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; plan, north at the top, room 240 by 180 in from (300, 90); windows along the south wall -->
<path class="ink" d="M300 186 L300 90 L1260 90 L1260 810 L300 810 L300 330"/>
<!-- entrance: 36 in door at the north end of the west wall, swing into the space, so a person walking in faces the east wall -->
<line class="soft" x1="300" y1="330" x2="444" y2="330"/>
<path class="soft" d="M444 330 A144 144 0 0 0 300 186"/>
<!-- two large windows 95 in each with a 20 in pier between; open chevrons point outward to the view -->
<rect class="soft" x="380" y="804" width="380" height="12"/>
<path class="soft" d="M461 832 L475 850 L489 832"/>
<path class="soft" d="M556 832 L570 850 L584 832"/>
<path class="soft" d="M651 832 L665 850 L679 832"/>
<rect class="soft" x="840" y="804" width="380" height="12"/>
<path class="soft" d="M921 832 L935 850 L949 832"/>
<path class="soft" d="M1016 832 L1030 850 L1044 832"/>
<path class="soft" d="M1111 832 L1125 850 L1139 832"/>
<!-- the work on the east wall, met head on from the entrance, 60 in; the ghost on the pier between the windows -->
<rect class="tp" x="1252" y="178" width="12" height="240"/>
<rect class="lead" x="760" y="798" width="80" height="16" stroke-width="2"/>
<line class="eye" x1="300" y1="258" x2="1258" y2="298"/>
<line class="eye" x1="1258" y1="298" x2="1028" y2="810"/>
<circle class="tp" cx="300" cy="258" r="6"/>
<circle class="tp" cx="1258" cy="298" r="6"/>
<text class="l1" x="1520" y="62" text-anchor="end">the work, seen first</text>
<line class="lead" x1="1400" y1="74" x2="1268" y2="174"/>
<text class="l1" x="800" y="890" text-anchor="middle">not between the windows</text>
<text class="l2" x="540" y="788" text-anchor="middle">view</text>
<text class="l2" x="286" y="282" text-anchor="end">entrance</text>
</svg>
