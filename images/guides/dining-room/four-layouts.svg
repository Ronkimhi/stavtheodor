<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Four dining room wall layouts drawn to scale: one large work centered above a sideboard, three small works in a row above a table, a pair of vertical works flanking a doorway, and a gallery wall on a long wall facing the table</title>
