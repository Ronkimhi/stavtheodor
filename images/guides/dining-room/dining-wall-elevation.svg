<line class="dim" x1="800" y1="402" x2="800" y2="446" stroke-width="2"/>
<!-- in front: chairs with 36 in backs, the table at 30 in, two pendants with 12 in shades 34 in either side of center, bottoms at 62 in (4 in clear of the frame, 2 in inside the table ends) -->
<rect class="soft" x="568" y="592" width="144" height="144"/>
<rect class="soft" x="568" y="736" width="144" height="16"/>
