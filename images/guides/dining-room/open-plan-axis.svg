<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Plan and elevation of an open plan space: the dining art is centered on the table's axis, and a dotted outline shows the wrong position at the middle of the long wall</title>
<desc id="d">Plan and elevation of an open plan space: the dining art is centered on the table's axis, and a dotted outline shows the wrong position at the middle of the long wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 3 px for plan and elevation; wall 300 in from x=350; table 84 by 40 in centered 110 in from the left; elevation floor at y=880 -->
<!-- plan: the long wall along the top, returns at both ends, a door in the left return -->
<line class="ink" x1="350" y1="120" x2="1250" y2="120"/>
<line class="ink" x1="350" y1="120" x2="350" y2="300"/>
<line class="ink" x1="350" y1="408" x2="350" y2="480"/>
<line class="soft" x1="350" y1="408" x2="458" y2="408"/>
<path class="soft" d="M458 408 A108 108 0 0 0 350 300"/>
<line class="ink" x1="1250" y1="120" x2="1250" y2="480"/>
<rect class="soft" x="554" y="240" width="252" height="120" rx="6"/>
<rect class="soft" x="578" y="186" width="48" height="48" rx="4"/>
<rect class="soft" x="578" y="366" width="48" height="48" rx="4"/>
<rect class="soft" x="662" y="186" width="48" height="48" rx="4"/>
<rect class="soft" x="662" y="366" width="48" height="48" rx="4"/>
<rect class="soft" x="746" y="186" width="48" height="48" rx="4"/>
<rect class="soft" x="746" y="366" width="48" height="48" rx="4"/>
<rect class="soft" x="950" y="330" width="252" height="114"/>
<line class="soft" x1="950" y1="354" x2="1202" y2="354"/>
<line class="eye" x1="680" y1="300" x2="680" y2="120"/>
<circle class="tp" cx="680" cy="300" r="6"/>
<rect class="tp" x="596" y="116" width="168" height="12"/>
<text class="l2" x="680" y="520" text-anchor="middle">dining zone</text>
<text class="l2" x="1076" y="520" text-anchor="middle">living zone</text>
<!-- elevation: the table (top 30 in) and the sofa (back 32 in) in front of the wall; the work 56 by 36 in centered on the table axis, center 57, 9 in over the table top; ghost centered on the wall at 150 in -->
<line class="ink" x1="350" y1="880" x2="1250" y2="880"/>
<line class="soft" x1="350" y1="880" x2="350" y2="592"/>
<line class="soft" x1="1250" y1="880" x2="1250" y2="592"/>
<rect class="soft" x="554" y="790" width="252" height="6"/>
<rect class="soft" x="563" y="796" width="6" height="84"/>
<rect class="soft" x="791" y="796" width="6" height="84"/>
<rect class="soft" x="950" y="784" width="252" height="48"/>
<rect class="soft" x="950" y="832" width="252" height="18"/>
<rect class="soft" x="950" y="802" width="18" height="30"/>
<rect class="soft" x="1184" y="802" width="18" height="30"/>
<line class="soft" x1="962" y1="850" x2="962" y2="880"/>
<line class="soft" x1="1190" y1="850" x2="1190" y2="880"/>
<rect class="lead" x="716" y="655" width="168" height="108"/>
<rect class="frame" x="596" y="655" width="168" height="108"/>
<rect class="art" x="608" y="667" width="144" height="84"/>
<line class="dim" x1="658" y1="709" x2="702" y2="709" stroke-width="2"/>
<line class="dim" x1="680" y1="687" x2="680" y2="731" stroke-width="2"/>
<text class="l1" x="680" y="930" text-anchor="middle">on the table's axis</text>
<text class="l1" x="840" y="615" text-anchor="middle">not the middle of the wall</text>
<line class="lead" x1="860" y1="625" x2="872" y2="651"/>
</svg>
