<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Two elevations of the same office wall: one large work about two thirds of the wall's width with its center at eye level, and seven small frames scattered across the wall at different heights</title>
<desc id="d">Two elevations of the same office wall: one large work about two thirds of the wall's width with its center at eye level, and seven small frames scattered across the wall at different heights</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 5 px; floor at y=680; two panels of the same 120 by 108 in wall, A at x 140 to 740, B at x 860 to 1460 -->
<line class="ink" x1="80" y1="680" x2="1520" y2="680"/>
<!-- wall: ceiling line and wall edges -->
<line class="ink" x1="140" y1="140" x2="740" y2="140"/>
<line class="ink" x1="140" y1="680" x2="140" y2="140"/>
<line class="ink" x1="740" y1="680" x2="740" y2="140"/>
<!-- wall: ceiling line and wall edges -->
<line class="ink" x1="860" y1="140" x2="1460" y2="140"/>
<line class="ink" x1="860" y1="680" x2="860" y2="140"/>
<line class="ink" x1="1460" y1="680" x2="1460" y2="140"/>
<!-- eye band at 57 and 60 in, continuous across both panels -->
<line class="eye" x1="140" y1="395" x2="1460" y2="395"/>
<line class="eye" x1="140" y1="380" x2="1460" y2="380"/>
<!-- panel A: one work 80 by 54 in, x 240 to 640, bottom 31 in, top 85 in, center 58 in; 20 in of wall each side -->
<rect class="frame" x="240" y="255" width="400" height="270"/>
<rect class="art" x="256" y="271" width="368" height="238"/>
<line class="dim" x1="418" y1="390" x2="462" y2="390" stroke-width="2"/>
<line class="dim" x1="440" y1="368" x2="440" y2="412" stroke-width="2"/>
<line class="dim" x1="240" y1="225" x2="640" y2="225"/>
<line class="dim" x1="240" y1="217" x2="240" y2="233"/>
<line class="dim" x1="640" y1="217" x2="640" y2="233"/>
<text class="l2" x="440" y="213" text-anchor="middle">about two thirds of the wall</text>
<!-- panel B: seven frames 11 by 14 in at uneven gaps, no shared line, no group center (stated exception to HG0 rule 3) -->
<rect class="frame" x="910" y="410" width="55" height="70"/>
<rect class="art" x="916" y="416" width="43" height="58"/>
<rect class="frame" x="1000" y="300" width="55" height="70"/>
<rect class="art" x="1006" y="306" width="43" height="58"/>
<rect class="frame" x="1080" y="440" width="55" height="70"/>
<rect class="art" x="1086" y="446" width="43" height="58"/>
<rect class="frame" x="1150" y="335" width="55" height="70"/>
<rect class="art" x="1156" y="341" width="43" height="58"/>
<rect class="frame" x="1235" y="390" width="55" height="70"/>
<rect class="art" x="1241" y="396" width="43" height="58"/>
<rect class="frame" x="1320" y="280" width="55" height="70"/>
<rect class="art" x="1326" y="286" width="43" height="58"/>
<rect class="frame" x="1380" y="420" width="55" height="70"/>
<rect class="art" x="1386" y="426" width="43" height="58"/>
<!-- band label: no clear strip of 260 px touches the band inside panel B, so it sits in the wall's upper right with a leader down to the band -->
<text class="l2" x="1450" y="262" text-anchor="end">57 to 60 in · 145 to 152 cm</text>
<line class="lead" x1="1450" y1="272" x2="1450" y2="378"/>
<text class="l1" x="440" y="740" text-anchor="middle">One large work</text>
<text class="l2" x="440" y="774" text-anchor="middle">reads from across the space</text>
<text class="l1" x="1160" y="740" text-anchor="middle">Seven small frames</text>
<text class="l2" x="1160" y="774" text-anchor="middle">reads as decoration</text>
</svg>
