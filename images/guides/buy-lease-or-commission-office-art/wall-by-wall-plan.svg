<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Floor plan of an example office with the route marked on each art wall: a commission on the reception wall a visitor sees from the entrance, originals in the conference room and a partner office, leased works along the corridor, and prints in the back office</title>
<desc id="d">Floor plan of an example office with the route marked on each art wall: a commission on the reception wall a visitor sees from the entrance, originals in the conference room and a partner office, leased works along the corridor, and prints in the back office</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 1.25 px; plan 800 by 480 in at x 420 to 1420, y 160 to 760; px = 420 + 1.25 x, 160 + 1.25 y -->
<!-- outer walls, with the entrance door at x 72 to 108 on the south wall -->
<line class="ink" x1="420" y1="160" x2="1420" y2="160"/>
<line class="ink" x1="1420" y1="160" x2="1420" y2="760"/>
<line class="ink" x1="420" y1="160" x2="420" y2="760"/>
<line class="ink" x1="420" y1="760" x2="510" y2="760"/>
<line class="ink" x1="555" y1="760" x2="1420" y2="760"/>
<line class="soft" x1="510" y1="760" x2="510" y2="715"/>
<path class="soft" d="M510 715 A45 45 0 0 1 555 760"/>
<!-- the wall at y 200: conference room and partner offices to the north; door gaps at 250 to 286, 500 to 536, 750 to 786 -->
<line class="ink" x1="420" y1="410" x2="732.5" y2="410"/>
<line class="ink" x1="777.5" y1="410" x2="1045" y2="410"/>
<line class="ink" x1="1090" y1="410" x2="1357.5" y2="410"/>
<line class="ink" x1="1402.5" y1="410" x2="1420" y2="410"/>
<!-- conference room x 0 to 300, y 0 to 200; door opens south to the corridor -->
<line class="ink" x1="795" y1="160" x2="795" y2="410"/>
<line class="soft" x1="777.5" y1="410" x2="777.5" y2="455"/>
<path class="soft" d="M777.5 455 A45 45 0 0 1 732.5 410"/>
<rect class="soft" x="517.5" y="255" width="180" height="60" rx="16"/>
<rect class="soft" x="535" y="222.5" width="25" height="25" rx="6"/>
<rect class="soft" x="535" y="322.5" width="25" height="25" rx="6"/>
<rect class="soft" x="595" y="222.5" width="25" height="25" rx="6"/>
<rect class="soft" x="595" y="322.5" width="25" height="25" rx="6"/>
<rect class="soft" x="655" y="222.5" width="25" height="25" rx="6"/>
<rect class="soft" x="655" y="322.5" width="25" height="25" rx="6"/>
<!-- partner offices x 300 to 550 and 550 to 800; desks 72 by 36 facing the door, two visitor chairs south of each -->
<line class="ink" x1="1107.5" y1="160" x2="1107.5" y2="410"/>
<line class="soft" x1="1045" y1="410" x2="1045" y2="365"/>
<path class="soft" d="M1045 365 A45 45 0 0 1 1090 410"/>
<line class="soft" x1="1357.5" y1="410" x2="1357.5" y2="365"/>
<path class="soft" d="M1357.5 365 A45 45 0 0 1 1402.5 410"/>
<rect class="soft" x="906.2" y="210" width="90" height="45" rx="6"/>
<rect class="soft" x="921.2" y="262.5" width="25" height="25" rx="6"/>
<rect class="soft" x="956.2" y="262.5" width="25" height="25" rx="6"/>
<rect class="soft" x="1218.8" y="210" width="90" height="45" rx="6"/>
<rect class="soft" x="1233.8" y="262.5" width="25" height="25" rx="6"/>
<rect class="soft" x="1268.8" y="262.5" width="25" height="25" rx="6"/>
<!-- reception x 0 to 180, y 200 to 480, open to the corridor between y 200 and 260; desk 96 by 30; two visitor chairs on the west wall -->
<line class="ink" x1="645" y1="485" x2="645" y2="760"/>
<rect class="soft" x="472.5" y="472.5" width="120" height="37.5" rx="6"/>
<rect class="soft" x="430" y="585" width="30" height="30" rx="6"/>
<rect class="soft" x="430" y="635" width="30" height="30" rx="6"/>
<!-- back office x 180 to 800, y 260 to 480, open to the corridor at x 700 to 760; eight 60 by 30 workstations in two rows -->
<line class="ink" x1="645" y1="485" x2="1295" y2="485"/>
<line class="ink" x1="1370" y1="485" x2="1420" y2="485"/>
<rect class="soft" x="970" y="535" width="75" height="37.5" rx="4"/>
<rect class="soft" x="970" y="660" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1070" y="535" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1070" y="660" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1170" y="535" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1170" y="660" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1270" y="535" width="75" height="37.5" rx="4"/>
<rect class="soft" x="1270" y="660" width="75" height="37.5" rx="4"/>
<!-- marked art walls, 12 px deep on the space side of the wall line -->
<rect class="tp" x="457.5" y="410" width="150" height="12"/>
<rect class="tp" x="532.5" y="160" width="150" height="12"/>
<rect class="tp" x="906.2" y="398" width="90" height="12"/>
<rect class="tp" x="885" y="473" width="45" height="12"/>
<rect class="tp" x="1005" y="473" width="45" height="12"/>
<rect class="tp" x="1125" y="473" width="45" height="12"/>
<rect class="tp" x="1408" y="422.5" width="12" height="50"/>
<rect class="tp" x="707.5" y="748" width="50" height="12"/>
<rect class="tp" x="795" y="748" width="50" height="12"/>
<!-- sightline from the entrance door to the reception mark -->
<line class="eye" x1="532.5" y1="760" x2="532.5" y2="422"/>
<circle class="tp" cx="532.5" cy="760" r="6"/>
<!-- labels -->
<text class="l1" x="404" y="424" text-anchor="end">Commission</text>
<line class="lead" x1="412" y1="416" x2="455.5" y2="416"/>
<text class="l2" x="404" y="456" text-anchor="end">or an original</text>
<text class="l2" x="404" y="486" text-anchor="end">seen first from the door</text>
<text class="l1" x="532.5" y="148">Original<tspan class="l2"> · conference room: the wall the chairs face</tspan></text>
<text class="l1" x="803" y="332">Original</text>
<text class="l2" x="803" y="358">partner office:</text>
<text class="l2" x="803" y="384">the wall the desk faces</text>
<text class="l1" x="800" y="456">Lease</text>
<text class="l2" x="960" y="456">corridor: rotates at agreed intervals</text>
<text class="l1" x="776" y="812" text-anchor="middle">Prints or editions</text>
<text class="l2" x="776" y="846" text-anchor="middle">back office</text>
<text class="l2" x="532.5" y="790" text-anchor="middle">entrance</text>
</svg>
