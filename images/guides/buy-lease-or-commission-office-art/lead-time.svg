<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
<title id="t">Timeline counted back from the move date: a commission starts first, with the brief, staged approvals and installation; buying originals starts later; prints and leased works start last, and leased works then rotate at agreed intervals</title>
<desc id="d">Timeline counted back from the move date: a commission starts first, with the brief, staged approvals and installation; buying originals starts later; prints and leased works start last, and leased works then rotate at agreed intervals</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: none, time is ordinal; move line at x 1360; lanes at y 240, 380, 520, 660; lane lengths are drawing choices, never durations -->
<!-- the move line -->
<line class="ink" x1="1360" y1="140" x2="1360" y2="700"/>
<text class="l1" x="1360" y="116" text-anchor="middle">Move in<tspan class="l2"> · art on the wall</tspan></text>
<!-- lane: Commission -->
<line class="ink" x1="240" y1="240" x2="1360" y2="240"/>
<text class="l1" x="240" y="214">Commission</text>
<circle class="tp" cx="240" cy="240" r="10"/>
<text class="l2" x="240" y="280" text-anchor="middle">brief agreed</text>
<circle class="tp" cx="800" cy="240" r="10"/>
<text class="l2" x="800" y="280" text-anchor="middle">stages approved</text>
<circle class="tp" cx="1360" cy="240" r="10"/>
<!-- lane: Originals -->
<line class="ink" x1="640" y1="380" x2="1360" y2="380"/>
<text class="l1" x="640" y="354">Originals</text>
<circle class="tp" cx="640" cy="380" r="10"/>
<text class="l2" x="640" y="420" text-anchor="middle">search</text>
<circle class="tp" cx="1000" cy="380" r="10"/>
<text class="l2" x="1000" y="420" text-anchor="middle">short list approved</text>
<circle class="tp" cx="1360" cy="380" r="10"/>
<!-- lane: Prints -->
<line class="ink" x1="1000" y1="520" x2="1360" y2="520"/>
<text class="l1" x="1000" y="494">Prints</text>
<circle class="tp" cx="1000" cy="520" r="10"/>
<text class="l2" x="1000" y="560" text-anchor="middle">chosen</text>
<circle class="tp" cx="1180" cy="520" r="10"/>
<text class="l2" x="1180" y="560" text-anchor="middle">framed</text>
<circle class="tp" cx="1360" cy="520" r="10"/>
<!-- lane: Lease -->
<line class="ink" x1="1000" y1="660" x2="1360" y2="660"/>
<line class="lead" x1="820" y1="660" x2="1000" y2="660"/>
<line class="lead" x1="1360" y1="660" x2="1500" y2="660"/>
<line class="dim" x1="1410" y1="652" x2="1410" y2="668"/>
<line class="dim" x1="1460" y1="652" x2="1460" y2="668"/>
<text class="l1" x="820" y="634">Lease<tspan class="l2"> · depending on stock</tspan></text>
<text class="l2" x="1378" y="700">then rotates</text>
<circle class="tp" cx="1000" cy="660" r="10"/>
<text class="l2" x="1000" y="700" text-anchor="middle">picked from stock</text>
<circle class="tp" cx="1200" cy="660" r="10"/>
<text class="l2" x="1200" y="700" text-anchor="middle">delivered</text>
<circle class="tp" cx="1360" cy="660" r="10"/>
<!-- time axis, no ticks -->
<line class="soft" x1="240" y1="720" x2="1360" y2="720"/>
<text class="l2" x="800" y="758" text-anchor="middle">time before the move</text>
</svg>
