<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Floor plan of a one bedroom living area: one dashed sightline from the front doorway and one from the sofa both land on the wall the sofa faces, marked as the anchor wall</title>
<desc id="d">Floor plan of a one bedroom living area: one dashed sightline from the front doorway and one from the sofa both land on the wall the sofa faces, marked as the anchor wall</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
    .lead{stroke-width:2.5}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; plan, north wall at the top, inner faces 192 by 156 in, northwest corner at (416, 176) -->
<!-- walls with a 36 in front door opening in the south wall (x 132 to 168) and a 32 in opening to the bedroom in the east wall (y 36 to 68) -->
<path class="ink" d="M944 800 L416 800 L416 176 L1184 176 L1184 320"/>
<path class="ink" d="M1184 448 L1184 800 L1088 800"/>
<!-- front door: leaf hinged at (168, 156), open to (168, 120); swing arc radius 36 in to (132, 156) -->
<line class="soft" x1="1088" y1="800" x2="1088" y2="656"/>
<path class="soft" d="M944 800 A144 144 0 0 1 1088 656"/>
<!-- window 60 in on the west wall, y 40 to 100 -->
<rect class="soft" x="410" y="336" width="12" height="240"/>
<!-- sofa 72 by 36 in plan, back to the south wall, facing north, x 12 to 84, y 118 to 154; back line at y 146 -->
<rect class="soft" x="464" y="648" width="288" height="144" rx="4"/>
<line class="soft" x1="464" y1="760" x2="752" y2="760"/>
<line class="soft" x1="488" y1="648" x2="488" y2="760"/>
<line class="soft" x1="728" y1="648" x2="728" y2="760"/>
<!-- coffee table 40 by 20, x 28 to 68, y 76 to 96 -->
<rect class="soft" x="528" y="480" width="160" height="80" rx="4"/>
<!-- anchor wall: tp rect 3 in (12 px) deep on the north wall's inner face, x 24 to 72, two thirds of the sofa, facing the sofa -->
<rect class="tp" x="512" y="176" width="192" height="12"/>
<!-- sightline from the doorway: dot at (150, 150) to (66, 3); at y 96 it is at x 119 (table ends 68), at y 118 at x 132 (sofa ends 84) -->
<line class="eye" x1="1016" y1="776" x2="680" y2="188"/>
<circle class="tp" cx="1016" cy="776" r="6"/>
<!-- sightline from the sofa: dot at the center seat (48, 132), straight north to (48, 3); it crosses the coffee table in plan -->
<line class="eye" x1="608" y1="704" x2="608" y2="188"/>
<circle class="tp" cx="608" cy="704" r="6"/>
<text class="l1" x="608" y="146" text-anchor="middle">anchor wall<tspan class="l2"> · the wall that wins both sightlines</tspan></text>
<text class="l1" x="1016" y="850" text-anchor="middle">door</text>
<text class="l1" x="608" y="850" text-anchor="middle">sofa</text>
<text class="l2" x="940" y="600">from the doorway</text>
<text class="l2" x="620" y="626">from the sofa</text>
<text class="l2" x="400" y="464" text-anchor="end">window</text>
<text class="l2" x="1196" y="392">to the bedroom</text>
</svg>
