<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">Floor plan of an open living and dining area: the sightline from the front door lands on the wall behind the sofa, marked as the first wall for the best original, with the wall beside it marked as a supporting wall for editions and prints</title>
<desc id="d">Floor plan of an open living and dining area: the sightline from the front door lands on the wall behind the sofa, marked as the first wall for the best original, with the wall beside it marked as a supporting wall for editions and prints</desc>
<style>
  .ink{stroke:#F2F0EC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{stroke:#F2F0EC;stroke-opacity:.55;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .frame{fill:#1A1A20;stroke:#F2F0EC;stroke-width:2}
  .art{fill:#9D7663;fill-opacity:.24}
  .dim{stroke:#9D7663;fill:none;stroke-width:1.25}
  .eye{stroke:#9D7663;fill:none;stroke-width:1.25;stroke-dasharray:10 8}
  .lead{stroke:#9D7663;fill:none;stroke-width:1;stroke-dasharray:3 7;stroke-opacity:.7}
  .l1,.l2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;fill:#F2F0EC;font-size:26px;font-weight:500}
  .l2{fill:#A5A3AC;font-size:22px;font-weight:400}
  .tp{fill:#9D7663}
  @media (max-width:560px){
    .l1{font-size:52px}
    .l2{display:none}
    .ink,.frame{stroke-width:3.5}
    .soft{stroke-width:3}
    .dim,.eye{stroke-width:2.75}
  }
  @media (max-width:220px){
    .l1{display:none}
  }
</style>
<!-- scale: 1 in = 4 px; plan, north wall at the top, inner faces 288 by 168 in, northwest corner at (224, 164) -->
<!-- walls, with a 36 in door opening in the south wall from x 36 to 72 -->
<path class="ink" d="M368 836 L224 836 L224 164 L1376 164 L1376 836 L512 836"/>
<!-- front door: leaf hinged at (36, 168), open to (36, 132); swing arc radius 36 in -->
<line class="soft" x1="368" y1="836" x2="368" y2="692"/>
<path class="soft" d="M368 692 A144 144 0 0 1 512 836"/>
<!-- sofa 84 by 38 in plan, back to the north wall; coffee table 48 by 24; two armchairs 32 by 32 facing the sofa -->
<rect class="soft" x="272" y="180" width="336" height="152" rx="4"/>
<line class="soft" x1="272" y1="212" x2="608" y2="212"/>
<line class="soft" x1="296" y1="212" x2="296" y2="332"/>
<line class="soft" x1="584" y1="212" x2="584" y2="332"/>
<rect class="soft" x="344" y="404" width="192" height="96" rx="4"/>
<rect class="soft" x="256" y="548" width="128" height="128" rx="6"/>
<line class="soft" x1="256" y1="652" x2="384" y2="652"/>
<rect class="soft" x="496" y="548" width="128" height="128" rx="6"/>
<line class="soft" x1="496" y1="652" x2="624" y2="652"/>
<!-- dining table 84 by 42 with six chairs 18 by 18, three a side -->
<rect class="soft" x="968" y="416" width="336" height="168" rx="4"/>
<rect class="soft" x="1004" y="336" width="72" height="72" rx="4"/>
<rect class="soft" x="1004" y="592" width="72" height="72" rx="4"/>
<rect class="soft" x="1100" y="336" width="72" height="72" rx="4"/>
<rect class="soft" x="1100" y="592" width="72" height="72" rx="4"/>
<rect class="soft" x="1196" y="336" width="72" height="72" rx="4"/>
<rect class="soft" x="1196" y="592" width="72" height="72" rx="4"/>
<!-- first wall: 12 px marker on the north wall's inner face over the sofa; supporting wall: 6 px marker over the dining area -->
<rect class="tp" x="272" y="164" width="336" height="12"/>
<rect class="tp" x="944" y="164" width="384" height="6"/>
<!-- sightline from just inside the door, straight north to the first wall -->
<line class="eye" x1="440" y1="804" x2="440" y2="176"/>
<circle class="tp" cx="440" cy="804" r="6"/>
<text class="l1" x="440" y="146" text-anchor="middle">first wall</text>
<text class="l2" x="440" y="116" text-anchor="middle">the best original you can</text>
<text class="l1" x="1136" y="252" text-anchor="middle">supporting wall</text>
<text class="l2" x="1136" y="288" text-anchor="middle">editions and prints</text>
<text class="l2" x="440" y="872" text-anchor="middle">front door</text>
<text class="l2" x="536" y="284" text-anchor="middle">sofa</text>
<text class="l2" x="1136" y="500" text-anchor="middle">dining table</text>
<text class="l2" x="520" y="764">from the front door</text>
</svg>
